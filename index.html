    // =========================================================================
    // 3A. CONSOLA CAD AMPLIADA GESTOR DE DEMANDA (IMAGEN 2 + IMAGEN 3)
    // =========================================================================
    function ConsolaGestorDemanda({ usuario, incidentes, unidades, actualizarIncidente, eliminarIncidente }) {
      const [selectedId, setSelectedId] = useState(null);
      const [estadoAgente, setEstadoAgente] = useState('DISPONIBLE');
      const [segundosAtencion, setSegundosAtencion] = useState(0);
      const [showDirectorio, setShowDirectorio] = useState(false);
      const [showModalRevision, setShowModalRevision] = useState(false);
      const [busquedaDirectorio, setBusquedaDirectorio] = useState('');

      const [triajeABC, setTriajeABC] = useState({
        consciencia: '',
        respiracion: '',
        signos: []
      });

      const [form, setForm] = useState({
        telefono: '',
        telefonoPaciente: '',
        alertante: '',
        poblacion: '',
        parroquia: '',
        municipio: '',
        direccion: '',
        notas: '',
        nombrePac: '',
        edad: '',
        anioNac: '',
        sexo: 'H',
        nss: '',
        tipoDemanda: TIPOS_DEMANDA[0],
        interrogatorio: '',
        clasificacion: CLASIFICACIONES[1].code,
        agenciasNotificadas: ['061 SEM'],
        consejoAlertante: CONSEJOS_PREARRIVO[0],
        hacerSala: ACCIONES_HACER_SALA[0]
      });

      const dirInputRef = useRef(null);
      const clasifSelectRef = useRef(null);

      const entrantes = incidentes.filter(i => i.estado === 'LLAMADA_ENTRANTE');
      const enCurso = incidentes.filter(i => i.estado === 'EN_ATENCION');
      const incidenteActivo = incidentes.find(i => i.id === selectedId);
      const idxActual = incidentes.findIndex(i => i.id === selectedId);

      useEffect(() => {
        if (!incidenteActivo || incidenteActivo.estado !== 'EN_ATENCION') {
          setSegundosAtencion(0);
          return;
        }
        const t = setInterval(() => setSegundosAtencion(s => s + 1), 1000);
        return () => clearInterval(t);
      }, [incidenteActivo?.id, incidenteActivo?.estado]);

      useEffect(() => {
        if (incidenteActivo) {
          const calcAnio = incidenteActivo.edad ? String(2026 - parseInt(incidenteActivo.edad || 0)) : '';
          setForm({
            telefono: incidenteActivo.telefono || '',
            telefonoPaciente: incidenteActivo.telefonoPaciente || '',
            alertante: incidenteActivo.alertante || '',
            poblacion: incidenteActivo.poblacion || '',
            parroquia: incidenteActivo.parroquia || '',
            municipio: incidenteActivo.municipio || '',
            direccion: incidenteActivo.direccion || '',
            notas: incidenteActivo.notas || '',
            nombrePac: incidenteActivo.nombrePac || '',
            edad: incidenteActivo.edad || '',
            anioNac: incidenteActivo.anioNac || calcAnio,
            sexo: incidenteActivo.sexo || 'H',
            nss: incidenteActivo.nss || '',
            tipoDemanda: incidenteActivo.tipoDemanda || TIPOS_DEMANDA[0],
            interrogatorio: incidenteActivo.interrogatorio || '',
            clasificacion: incidenteActivo.clasificacion || CLASIFICACIONES[1].code,
            agenciasNotificadas: incidenteActivo.agenciasNotificadas || ['061 SEM'],
            consejoAlertante: incidenteActivo.consejoAlertante || CONSEJOS_PREARRIVO[0],
            hacerSala: incidenteActivo.hacerSala || ACCIONES_HACER_SALA[0]
          });
          setTriajeABC({ consciencia: '', respiracion: '', signos: [] });
          if (incidenteActivo.estado === 'EN_ATENCION') {
            setEstadoAgente('EN LLAMADA');
          }
        } else {
          setEstadoAgente('DISPONIBLE');
        }
      }, [selectedId]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F2') {
            e.preventDefault();
            atenderSiguienteLlamada();
          } else if (e.altKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            dirInputRef.current?.focus();
          } else if (e.altKey && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            setShowDirectorio(prev => !prev);
          } else if (e.altKey && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            clasifSelectRef.current?.focus();
          } else if (e.altKey && e.key.toLowerCase() === 'v') {
            e.preventDefault();
            if (incidenteActivo) setShowModalRevision(true);
          } else if (e.altKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            if (incidenteActivo) traspasarARespuesta();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      });

      const handleEdadChange = (val) => {
        const num = parseInt(val, 10);
        const anio = !isNaN(num) && num > 0 && num < 120 ? String(2026 - num) : '';
        setForm(prev => ({ ...prev, edad: val, anioNac: anio }));
      };

      const handleAnioChange = (val) => {
        const num = parseInt(val, 10);
        const ed = !isNaN(num) && num > 1900 && num <= 2026 ? String(2026 - num) : '';
        setForm(prev => ({ ...prev, anioNac: val, edad: ed }));
      };

      const aplicarBotonTriaje = (campo, valor) => {
        const nextTriaje = { ...triajeABC };
        if (campo === 'signos') {
          if (nextTriaje.signos.includes(valor)) {
            nextTriaje.signos = nextTriaje.signos.filter(s => s !== valor);
          } else {
            nextTriaje.signos = [...nextTriaje.signos, valor];
          }
        } else {
          nextTriaje[campo] = valor;
        }
        setTriajeABC(nextTriaje);

        const partes = [];
        if (nextTriaje.consciencia) partes.push(`Consciencia: ${nextTriaje.consciencia}`);
        if (nextTriaje.respiracion) partes.push(`Respiración: ${nextTriaje.respiracion}`);
        if (nextTriaje.signos.length > 0) partes.push(`Signos: ${nextTriaje.signos.join(', ')}`);

        const resumenABC = `[VALORACIÓN ABC] ${partes.join(' | ')}`;

        let nuevaClasif = form.clasificacion;
        let nuevoConsejo = form.consejoAlertante;
        let nuevoHacer = form.hacerSala;
        let nuevoTipo = form.tipoDemanda;

        if (nextTriaje.respiracion === 'No respira / Gasping (PCR)') {
          nuevaClasif = CLASIFICACIONES[0].code;
          nuevoTipo = '03 - Parada Cardiorrespiratoria (PCR)';
          nuevoConsejo = CONSEJOS_PREARRIVO[1];
          nuevoHacer = ACCIONES_HACER_SALA[2];
        } else if (nextTriaje.consciencia === 'Inconsciente') {
          nuevaClasif = CLASIFICACIONES[0].code;
          nuevoConsejo = CONSEJOS_PREARRIVO[2];
          nuevoHacer = ACCIONES_HACER_SALA[0];
        } else if (nextTriaje.signos.includes('Dolor torácico')) {
          nuevaClasif = CLASIFICACIONES[0].code;
          nuevoTipo = '04 - Dolor torácico / Sospecha SCA';
          nuevoConsejo = CONSEJOS_PREARRIVO[3];
          nuevoHacer = ACCIONES_HACER_SALA[1];
        }

        setForm(prev => ({
          ...prev,
          clasificacion: nuevaClasif,
          tipoDemanda: nuevoTipo,
          consejoAlertante: nuevoConsejo,
          hacerSala: nuevoHacer,
          interrogatorio: resumenABC
        }));
      };

      const toggleAgencia = (agencia) => {
        setForm(prev => {
          const existe = prev.agenciasNotificadas.includes(agencia);
          return {
            ...prev,
            agenciasNotificadas: existe
              ? prev.agenciasNotificadas.filter(a => a !== agencia)
              : [...prev.agenciasNotificadas, agencia]
          };
        });
      };

      const atenderSiguienteLlamada = async () => {
        const sig = entrantes[0] || enCurso[0];
        if (!sig) {
          alert('No hay llamadas entrantes en cola.');
          return;
        }
        unlockAudio();
        playTone('ptt_in');
        setSelectedId(sig.id);
        setEstadoAgente('EN LLAMADA');
        if (sig.estado === 'LLAMADA_ENTRANTE') {
          const hora = new Date().toLocaleTimeString('es-ES');
          await actualizarIncidente(sig.id, {
            estado: 'EN_ATENCION',
            operadorDemanda: usuario.nombre,
            cronologia: [...(sig.cronologia || []), { hora, texto: `Llamada descolgada por ${usuario.nombre}` }]
          });
        }
      };

      const descartarPrueba = async () => {
        if (!incidenteActivo) return;
        if (!confirm(`¿Descartar ficha ${incidenteActivo.numFicha} como llamada de prueba o falsa alarma?`)) return;
        await eliminarIncidente(incidenteActivo.id);
        setSelectedId(null);
      };

      const guardarCambiosFicha = async () => {
        if (!incidenteActivo) return;
        await actualizarIncidente(incidenteActivo.id, { ...form });
        alert('Ficha ' + incidenteActivo.numFicha + ' guardada en servidor CAD.');
      };

      const traspasarARespuesta = async () => {
        if (!incidenteActivo) return;
        if (!form.direccion.trim() || !form.clasificacion) {
          alert('Debes completar la Dirección y la Clasificación antes de traspasar.');
          return;
        }
        const hora = new Date().toLocaleTimeString('es-ES');
        await actualizarIncidente(incidenteActivo.id, {
          ...form,
          estado: 'TRASPASADO',
          horaTraspaso: hora,
          operadorDemanda: usuario.nombre,
          cronologia: [
            ...(incidenteActivo.cronologia || []),
            {
              hora,
              texto: `Ficha clasificada (${form.clasificacion}) | Agencias: ${form.agenciasNotificadas.join(', ')} | Acción: ${form.hacerSala} | Traspasada por ${usuario.nombre}`
            }
          ]
        });
        setEstadoAgente('DISPONIBLE');
        setSelectedId(null);
      };

      const enviarMensajeEnLlamada = async (nuevoMsg) => {
        if (!incidenteActivo) return;
        await actualizarIncidente(incidenteActivo.id, {
          mensajesLlamada: [...(incidenteActivo.mensajesLlamada || []), nuevoMsg]
        });
      };

      const navegarRegistro = (dir) => {
        if (incidentes.length === 0) return;
        if (dir === 'FIRST') setSelectedId(incidentes[0].id);
        if (dir === 'LAST') setSelectedId(incidentes[incidentes.length - 1].id);
        if (dir === 'PREV') setSelectedId(incidentes[Math.max(0, idxActual - 1)].id);
        if (dir === 'NEXT') setSelectedId(incidentes[Math.min(incidentes.length - 1, idxActual + 1)].id);
      };

      const formatSLA = (sec) => {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div id="printable-ficha" className="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden flex flex-col flex-1 shadow-2xl text-xs">
          {/* BARRA SUPERIOR SOFTPHONE ACD + HERRAMIENTAS DE FICHA */}
          <div className="bg-slate-950 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap items-center gap-1.5">
              <div className={`px-2 py-1 rounded font-black text-[11px] flex items-center gap-1.5 ${
                estadoAgente === 'EN LLAMADA'
                  ? 'bg-red-950 border border-red-500 text-red-300'
                  : estadoAgente === 'PAUSA'
                  ? 'bg-amber-950 border border-amber-500 text-amber-300'
                  : 'bg-emerald-950 border border-emerald-500 text-emerald-300'
              }`}>
                <span className={`w-2 h-2 rounded-full ${
                  estadoAgente === 'EN LLAMADA' ? 'bg-red-500 animate-ping' :
                  estadoAgente === 'PAUSA' ? 'bg-amber-400' : 'bg-emerald-400'
                }`}></span>
                EXT. {usuario.user.toUpperCase()} · {estadoAgente}
              </div>

              <button
                type="button"
                onClick={atenderSiguienteLlamada}
                className={`px-2.5 py-1.5 rounded font-black flex items-center gap-1.5 transition ${
                  entrantes.length > 0
                    ? 'bg-emerald-600 hover:bg-emerald-500 text-white animate-pulse shadow-lg shadow-emerald-600/40'
                    : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                }`}
              >
                <i className="fa-solid fa-phone-volume"></i>
                Atender [F2] ({entrantes.length})
              </button>

              <button
                type="button"
                onClick={() => setShowDirectorio(true)}
                className="px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 font-bold"
              >
                <i className="fa-solid fa-address-book mr-1"></i>
                Directorio [Alt+R]
              </button>

              <button
                type="button"
                disabled={!incidenteActivo}
                onClick={() => setShowModalRevision(true)}
                className="px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 border border-slate-700 text-blue-300 font-bold"
              >
                <i className="fa-solid fa-eye mr-1"></i>
                Revisar [Alt+V]
              </button>

              <button
                type="button"
                onClick={() => window.print()}
                className="px-2 py-1.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold"
                title="Imprimir pantalla / ficha"
              >
                <i className="fa-solid fa-print"></i>
              </button>
            </div>

            {/* Navegador de registros << < > >> + SLA */}
            <div className="flex items-center gap-1.5">
              {incidenteActivo && (
                <div className={`px-2 py-1 rounded font-mono font-black border ${
                  segundosAtencion > 75
                    ? 'bg-red-950 border-red-500 text-red-300 animate-pulse'
                    : segundosAtencion > 45
                    ? 'bg-amber-950 border-amber-500 text-amber-300'
                    : 'bg-slate-900 border-slate-700 text-cyan-300'
                }`}>
                  SLA: {formatSLA(segundosAtencion)}
                </div>
              )}

              <div className="flex items-center bg-slate-900 border border-slate-700 rounded overflow-hidden">
                <button type="button" onClick={() => navegarRegistro('FIRST')} className="px-2 py-1 hover:bg-slate-800 text-slate-300 font-bold">&lt;&lt;</button>
                <button type="button" onClick={() => navegarRegistro('PREV')} className="px-2 py-1 hover:bg-slate-800 text-slate-300 font-bold border-l border-slate-700">&lt;</button>
                <button type="button" onClick={() => navegarRegistro('NEXT')} className="px-2 py-1 hover:bg-slate-800 text-slate-300 font-bold border-l border-slate-700">&gt;</button>
                <button type="button" onClick={() => navegarRegistro('LAST')} className="px-2 py-1 hover:bg-slate-800 text-slate-300 font-bold border-l border-slate-700">&gt;&gt;</button>
              </div>

              <select
                value={selectedId || ''}
                onChange={e => setSelectedId(e.target.value || null)}
                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs font-bold text-amber-300 max-w-[175px]"
              >
                <option value="">-- Cola ({incidentes.length}) --</option>
                {incidentes.map(inc => (
                  <option key={inc.id} value={inc.id}>
                    {inc.numFicha} | {inc.estado}
                  </option>
                ))}
              </select>
            </div>
          </div>

          {/* ALERTA DE SEÑAL AML Y AVISO AMBULANCIA */}
          <div className="bg-cyan-950/60 border-b border-cyan-800/70 px-3 py-1 flex flex-wrap items-center justify-between gap-2 text-[11px]">
            {incidenteActivo ? (
              <>
                <div className="flex items-center gap-2">
                  <span className="bg-cyan-600 text-slate-950 font-black px-1.5 py-0.5 rounded text-[10px]">AML GPS</span>
                  <span className="font-mono text-cyan-200 font-bold">
                    {incidenteActivo.lat}, {incidenteActivo.lng} (±{incidenteActivo.precision}m) · Ficha: {incidenteActivo.numFicha}
                  </span>
                </div>
                <span className="text-amber-300 font-mono">
                  Fecha: {incidenteActivo.fecha} · H. Llamada: {incidenteActivo.horaLlamada}
                </span>
              </>
            ) : (
              <span className="text-amber-300/90">
                <i className="fa-solid fa-circle-info mr-1.5"></i>
                SI QUIEN LLAMA ES UNA AMBULANCIA y no se detectó automáticamente, pulsa <strong>Directorio [Alt+R]</strong> o busca el servicio por nº ficha/municipio.
              </span>
            )}
          </div>

          {/* CUERPO PRINCIPAL CAD AMPLIADO (3 COLUMNAS) */}
          <div className="flex-1 grid grid-cols-1 xl:grid-cols-12 gap-3 p-3 overflow-y-auto cad-scroll">
            
            {/* COLUMNA 1 (4 cols): TELÉFONOS (ALERTA/PACIENTE) + LOCALIZACIÓN + FILIACIÓN (AÑO NACIM) + MAPA */}
            <div className="xl:col-span-4 space-y-2">
              <div className="bg-slate-950 border border-slate-800 rounded-lg p-2.5 space-y-2">
                <div className="text-[11px] font-black text-cyan-400 uppercase tracking-wider border-b border-slate-800 pb-1">
                  1. Teléfonos, Localización & Alertante
                </div>

                <div className="grid grid-cols-12 gap-1.5">
                  <div className="col-span-4">
                    <label className="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Tel. Alerta</label>
                    <input
                      type="text"
                      value={form.telefono}
                      onChange={e => setForm({ ...form, telefono: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 font-mono font-bold text-amber-300"
                    />
                  </div>
                  <div className="col-span-4">
                    <label className="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">Tel. Paciente</label>
                    <input
                      type="text"

    // =========================================================================
    // 3B. CONSOLA GESTOR DE RESPUESTA (061 SEM)
    // =========================================================================
    function ConsolaGestorRespuesta({
      usuario, incidentes, unidades, actualizarIncidente, actualizarUnidad, enviarMensajeRadio
    }) {
      const [selectedId, setSelectedId] = useState(null);
      const pendientes = incidentes.filter(i => i.estado === 'TRASPASADO' || i.estado === 'ASIGNADO');
      const incActivo = incidentes.find(i => i.id === selectedId) || pendientes[0] || null;

      useEffect(() => {
        if (!selectedId && pendientes.length > 0) {
          setSelectedId(pendientes[0].id);
        }
      }, [pendientes.length]);

      const asignarUnidad = async (unidad) => {
        if (!incActivo) return;
        if (unidad.estado !== 'DISPONIBLE') {
          alert(`La unidad ${unidad.id} no está disponible (${unidad.estado}).`);
          return;
        }
        const hora = new Date().toLocaleTimeString('es-ES');
        const nuevosRecursos = [...(incActivo.recursosAsignados || []), unidad.id];

        await actualizarUnidad(unidad.id, {
          estado: 'ACTIVADA',
          incidenteId: incActivo.id
        });

        await actualizarIncidente(incActivo.id, {
          estado: 'ASIGNADO',
          gestorRespuesta: usuario.nombre,
          recursosAsignados: nuevosRecursos,
          cronologia: [
            ...(incActivo.cronologia || []),
            { hora, texto: `Unidad ${unidad.id} (${unidad.tipo}) movilizada por ${usuario.nombre} hacia terminal embarcado` }
          ]
        });

        await enviarMensajeRadio({
          emisor: `CENTRAL 061 (${usuario.user.toUpperCase()})`,
          canal: 'CANAL 1 - EMERGENCIAS',
          texto: `Atención ${unidad.id}, servicio ${incActivo.numFicha} enviado a navegador embarcado: ${incActivo.clasificacion}. Dirección: ${incActivo.direccion} (${incActivo.municipio}).`
        });
      };

      const finalizarServicio = async (inc) => {
        const hora = new Date().toLocaleTimeString('es-ES');
        for (const uId of (inc.recursosAsignados || [])) {
          const baseOrig = UNIDADES_INICIALES.find(u => u.id === uId);
          await actualizarUnidad(uId, {
            estado: 'DISPONIBLE',
            incidenteId: null,
            lat: baseOrig?.lat || 41.3888,
            lng: baseOrig?.lng || 2.1619
          });
        }
        await actualizarIncidente(inc.id, {
          estado: 'FINALIZADO',
          cronologia: [...(inc.cronologia || []), { hora, texto: `Servicio cerrado y unidades liberadas por ${usuario.nombre}` }]
        });
      };

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 flex-1 flex flex-col gap-3">
          <div className="flex items-center justify-between border-b border-slate-800 pb-2">
            <div>
              <h2 className="font-bold text-base text-emerald-400">
                <i className="fa-solid fa-truck-medical mr-2"></i>
                Mesa de Coordinación GIS y Despacho de Flota (061 SEM)
              </h2>
              <p className="text-xs text-slate-400">Visualiza el punto AML del incidente, telemetría 5G y la posición GPS de las ambulancias</p>
            </div>
            <span className="bg-emerald-950 border border-emerald-600 text-emerald-300 text-xs font-bold px-2.5 py-1 rounded">
              {pendientes.length} Servicios Activos
            </span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-12 gap-4 flex-1">
            <div className="md:col-span-4 space-y-2 overflow-y-auto max-h-[500px] cad-scroll">
              <h3 className="text-xs font-bold uppercase text-slate-400">Bandeja de Servicios</h3>
              {pendientes.length === 0 ? (
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-4 text-xs text-slate-400 text-center">
                  No hay fichas traspasadas pendientes.
                </div>
              ) : (
                pendientes.map(inc => (
                  <div
                    key={inc.id}
                    onClick={() => setSelectedId(inc.id)}
                    className={`p-3 rounded-lg border cursor-pointer transition ${
                      incActivo?.id === inc.id
                        ? 'bg-slate-800 border-emerald-400 shadow-lg'
                        : 'bg-slate-950 border-slate-800 hover:border-slate-600'
                    }`}
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-mono font-bold text-xs text-amber-300">{inc.numFicha}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        inc.estado === 'TRASPASADO' ? 'bg-red-600 text-white animate-pulse' : 'bg-blue-600 text-white'
                      }`}>
                        {inc.estado}
                      </span>
                    </div>
                    <div className="text-xs font-bold text-white">{inc.clasificacion}</div>
                    <div className="text-xs text-slate-300 mt-0.5">
                      <i className="fa-solid fa-location-dot text-red-400 mr-1"></i>
                      {inc.direccion} ({inc.municipio})
                    </div>
                    {inc.recursosAsignados?.length > 0 && (
                      <div className="mt-1.5 flex flex-wrap gap-1">
                        {inc.recursosAsignados.map(r => (
                          <span key={r} className="bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">
                            {r}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>

            <div className="md:col-span-8 flex flex-col justify-between bg-slate-950 border border-slate-800 rounded-lg p-3 space-y-3">
              {incActivo ? (
                <>
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between items-start border-b border-slate-800 pb-1.5">
                      <div>
                        <span className="text-amber-400 font-mono font-bold">{incActivo.numFicha}</span>
                        <h4 className="font-bold text-sm text-white">{incActivo.tipoDemanda}</h4>
                      </div>
                      <button
                        onClick={() => finalizarServicio(incActivo)}
                        className="bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1 rounded text-xs font-bold border border-slate-700"
                      >
                        Cerrar Servicio
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-slate-900 p-2 rounded border border-slate-800">
                      <div><strong>Dirección:</strong> {incActivo.direccion}, {incActivo.municipio}</div>
                      <div><strong>GPS AML:</strong> <span className="font-mono text-cyan-400">{incActivo.lat}, {incActivo.lng}</span></div>
                      <div><strong>Paciente:</strong> {incActivo.nombrePac || 'No filiado'} ({incActivo.edad || '?'}a, {incActivo.sexo})</div>
                      <div><strong>Prioridad:</strong> <span className="text-red-400 font-bold">{incActivo.clasificacion}</span></div>
                      {incActivo.interrogatorio && (
                        <div className="col-span-2 text-cyan-200 border-t border-slate-800 pt-1">
                          <strong>Triaje 112:</strong> {incActivo.interrogatorio}
                        </div>
                      )}
                      {incActivo.constantesVitales5G && (
                        <div className="col-span-2 bg-emerald-950/70 border border-emerald-600 rounded px-2 py-1 text-emerald-300 font-mono text-[11px]">
                          <strong>📡 Telemetría 5G Ambulancia:</strong> FC {incActivo.constantesVitales5G.fc} lpm · TA {incActivo.constantesVitales5G.ta} mmHg · SatO2 {incActivo.constantesVitales5G.sato2}% · GCS {incActivo.constantesVitales5G.gcs}
                        </div>
                      )}
                    </div>

                    <MapaGIS
                      incidente={incActivo}
                      unidades={unidades}
                      altura="h-44"
                    />
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-1.5">
                      Flota SEM Disponible (Clic para enviar servicio al terminal embarcado):
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {unidades.map(u => (
                        <div
                          key={u.id}
                          className="bg-slate-900 border border-slate-800 rounded p-2 flex items-center justify-between"
                        >
                          <div>
                            <div className="font-bold text-xs text-white">
                              {u.id} <span className="text-cyan-400">({u.tipo})</span>
                            </div>
                            <div className="text-[11px] text-slate-400">{u.base}</div>
                          </div>

                          {u.estado === 'DISPONIBLE' ? (
                            <button
                              onClick={() => asignarUnidad(u)}
                              className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded"
                            >
                              Movilizar
                            </button>
                          ) : (
                            <span className="text-[10px] font-bold px-2 py-1 rounded bg-amber-950 text-amber-300 border border-amber-700">
                              {u.estado}
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              ) : (
                <div className="flex-1 flex items-center justify-center text-xs text-slate-500">
                  Selecciona un servicio de la izquierda para ver su mapa GIS y despachar unidades.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3C. TERMINAL EMBARCADO SEM CATALUNYA (ALTECH / 5G SMART AMBULANCE — IMAGEN 1)
    // =========================================================================
    function ConsolaUnidadMovilAltech({
      usuario, incidentes, unidades, actualizarIncidente, actualizarUnidad, enviarMensajeRadio
    }) {
      const miUnidad = unidades.find(u => u.id === usuario.indicativo) || unidades[0];
      const miServicio = incidentes.find(i => i.id === miUnidad?.incidenteId);

      // Pestañas reales de la tablet Altech SEM: INCIDENT | MISSATGERIA | NAVEGADOR | UTILITATS
      const [tabAltech, setTabAltech] = useState('NAVEGADOR');
      const [semaforoVerde5G, setSemaforoVerde5G] = useState(false);
      const [velocidadSimulada, setVelocidadSimulada] = useState(0);
      const [calleActual, setCalleActual] = useState(miUnidad?.base || 'Carrer d\'Enric Bargés 9/16');
      const [rutaCoords, setRutaCoords] = useState(null);
      const [infoRuta, setInfoRuta] = useState(null);
      const [hospitalDestino, setHospitalDestino] = useState(DIRECTORIO_CENTROS[0]);

      // Constantes vitales 5G Smart Ambulance
      const [vitales, setVitales] = useState({ fc: '96', ta: '135/82', sato2: '97', gcs: '15' });
      const [mensajeCECOS, setMensajeCECOS] = useState('');

      // Calcular ruta real por calles (OSRM) cuando la ambulancia tiene servicio asignado
      useEffect(() => {
        if (!miServicio?.lat || !miUnidad?.lat) {
          setRutaCoords(null);
          setInfoRuta(null);
          return;
        }

        const destLat = miUnidad.estado === 'TRASLADANDO' ? hospitalDestino.lat : miServicio.lat;
        const destLng = miUnidad.estado === 'TRASLADANDO' ? hospitalDestino.lng : miServicio.lng;

        const calcularRutaOSRM = async () => {
          try {
            const url = `https://router.project-osrm.org/route/v1/driving/${miUnidad.lng},${miUnidad.lat};${destLng},${destLat}?overview=full&geometries=geojson`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data && data.routes && data.routes.length > 0) {
              const r = data.routes[0];
              const latLngs = r.geometry.coordinates.map(c => [c[1], c[0]]);
              setRutaCoords(latLngs);
              setInfoRuta({
                distanciaKm: (r.distance / 1000).toFixed(1),
                minutos: Math.max(1, Math.round(r.duration / 60)),
                destinoNombre: miUnidad.estado === 'TRASLADANDO' ? hospitalDestino.nombre : miServicio.direccion
              });
            }
          } catch (e) {
            setRutaCoords([[miUnidad.lat, miUnidad.lng], [destLat, destLng]]);
          }
        };

        calcularRutaOSRM();
      }, [miServicio?.id, miUnidad?.lat, miUnidad?.lng, miUnidad?.estado, hospitalDestino]);

      const cambiarEstatus = async (nuevoEstado, codigoTetra) => {
        unlockAudio();
        playTone('ptt_out');
        const hora = new Date().toLocaleTimeString('es-ES');
        let nuevasCoords = { lat: miUnidad.lat, lng: miUnidad.lng };

        if (nuevoEstado === 'EN_CAMINO' && miServicio?.lat) {
          setVelocidadSimulada(64);
          setCalleActual('Av. Madrid -> Ruta prioritaria en curso');
          nuevasCoords = {
            lat: Number(((miUnidad.lat + miServicio.lat) / 2).toFixed(6)),
            lng: Number(((miUnidad.lng + miServicio.lng) / 2).toFixed(6))
          };
        } else if (nuevoEstado === 'EN_LUGAR' && miServicio?.lat) {
          setVelocidadSimulada(0);
          setSemaforoVerde5G(false);
          setCalleActual(miServicio.direccion);
          nuevasCoords = {
            lat: Number((miServicio.lat + 0.00015).toFixed(6)),
            lng: Number((miServicio.lng + 0.00015).toFixed(6))
          };
        } else if (nuevoEstado === 'TRASLADANDO') {
          setVelocidadSimulada(58);
          setCalleActual(`En ruta a ${hospitalDestino.nombre}`);
        } else if (nuevoEstado === 'EN_HOSPITAL') {
          setVelocidadSimulada(0);
          setSemaforoVerde5G(false);
          setCalleActual(hospitalDestino.direccion);
          nuevasCoords = { lat: hospitalDestino.lat, lng: hospitalDestino.lng };
        } else if (nuevoEstado === 'DISPONIBLE') {
          setVelocidadSimulada(0);
          setSemaforoVerde5G(false);
          const baseOrig = UNIDADES_INICIALES.find(u => u.id === miUnidad.id);
          setCalleActual(baseOrig?.base || 'Base Operativa');
          nuevasCoords = { lat: baseOrig?.lat || 41.3812, lng: baseOrig?.lng || 2.1422 };
        }

        await actualizarUnidad(miUnidad.id, {
          estado: nuevoEstado,
          incidenteId: nuevoEstado === 'DISPONIBLE' ? null : miUnidad.incidenteId,
          ...nuevasCoords
        });

        if (miServicio) {
          await actualizarIncidente(miServicio.id, {
            cronologia: [
              ...(miServicio.cronologia || []),
              { hora, texto: `[EMBARCAT ${miUnidad.id}] Estatus: ${nuevoEstado} (${codigoTetra})` }
            ]
          });
        }

        await enviarMensajeRadio({
          emisor: `UNIDAD ${miUnidad.id}`,
          canal: 'CANAL 1 - EMERGENCIAS',
          texto: `[SDS EMBARCAT] ${miUnidad.id} -> ${nuevoEstado} (${codigoTetra}).`
        });
      };

      const activarPrioridadSemaforica5G = async () => {
        const next = !semaforoVerde5G;
        setSemaforoVerde5G(next);
        unlockAudio();
        playTone('ptt_in');
        if (next) {
          await enviarMensajeRadio({
            emisor: `5G SMART AMBULANCE (${miUnidad.id})`,
            canal: 'CANAL 1 - EMERGENCIAS',
            texto: `🚦 V2X / 5G Prioridad Semafórica activada en ruta (${calleActual}) + Aviso acústico/radio a vehículos cercanos.`
          });
        }
      };

      const transmitirTelemetria5G = async (e) => {
        e.preventDefault();
        if (!miServicio) return;
        const hora = new Date().toLocaleTimeString('es-ES');
        await actualizarIncidente(miServicio.id, {
          constantesVitales5G: vitales,
          cronologia: [
            ...(miServicio.cronologia || []),
            { hora, texto: `[5G TELEMETRÍA ${miUnidad.id}] FC:${vitales.fc} TA:${vitales.ta} SatO2:${vitales.sato2}% GCS:${vitales.gcs}` }
          ]
        });
        alert('Constantes vitales enviadas en tiempo real al CECOS 061 y Hospital de destino.');
      };

      const enviarMensajeEmbarcat = async (e) => {
        e.preventDefault();
        if (!mensajeCECOS.trim()) return;
        await enviarMensajeRadio({
          emisor: `EMBARCAT ${miUnidad.id}`,
          canal: 'CANAL 1 - EMERGENCIAS',
          texto: `[MISSATGERIA ALTECH] ${mensajeCECOS.trim()}`
        });
        setMensajeCECOS('');
      };

      return (
        <div className="altech-bezel rounded-2xl p-2.5 flex-1 flex flex-col">
          {/* PANTALLA INTERNA DE LA TABLET ALTECH SEM CATALUNYA */}
          <div className="bg-black rounded-xl overflow-hidden flex-1 grid grid-cols-12 border-2 border-slate-800 min-h-[500px]">
            
            {/* BARRA LATERAL AMARILLA OFICIAL SEM ("emergències mèdiques" + YI12 + 4 BOTONES) */}
            <div className="col-span-3 sm:col-span-2 bg-[#facc15] text-black flex flex-col justify-between p-1.5 border-r-2 border-black">
              <div>
                {/* Logo oficial Emergències Mèdiques + 4 barres vermelles */}
                <div className="leading-none font-black text-[11px] sm:text-xs tracking-tight text-black">
                  emergències<br />mèdiques
                </div>
                <div className="grid grid-cols-4 gap-1 my-1">
                  <span className="h-1.5 bg-red-600 block"></span>
                  <span className="h-1.5 bg-red-600 block"></span>
                  <span className="h-1.5 bg-red-600 block"></span>
                  <span className="h-1.5 bg-red-600 block"></span>
                </div>

                {/* Indicativo grande tipo YI12 */}
                <div className="text-center font-black text-xl sm:text-2xl tracking-tighter text-black border-b border-black/30 pb-1 mb-1.5">
                  {miUnidad?.id}
                </div>

                {/* 4 Pulsadores negros/grises oficiales */}
                <div className="space-y-1.5">
                  <button
                    type="button"
                    onClick={() => setTabAltech('INCIDENT')}
                    className={`w-full py-2 px-1 rounded flex flex-col items-center justify-center border border-black transition relative ${
                      tabAltech === 'INCIDENT'
                        ? 'bg-slate-400 text-black font-black shadow-inner'
                        : 'bg-neutral-900 hover:bg-neutral-800 text-white font-bold'
                    }`}
                  >
                    <i className="fa-solid fa-truck-medical text-base mb-0.5"></i>
                    <span className="text-[10px]">Incident</span>
                    {miServicio && (
                      <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                    )}
                  </button>

                  <button
                    type="button"
                    onClick={() => setTabAltech('MISSATGERIA')}
                    className={`w-full py-2 px-1 rounded flex flex-col items-center justify-center border border-black transition ${
                      tabAltech === 'MISSATGERIA'
                        ? 'bg-slate-400 text-black font-black shadow-inner'
                        : 'bg-neutral-900 hover:bg-neutral-800 text-white font-bold'
                    }`}
                  >
                    <i className="fa-solid fa-envelope text-base mb-0.5"></i>
                    <span className="text-[10px]">Missatgeria</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setTabAltech('NAVEGADOR')}
                    className={`w-full py-2 px-1 rounded flex flex-col items-center justify-center border border-black transition ${
                      tabAltech === 'NAVEGADOR'
                        ? 'bg-slate-400 text-black font-black shadow-inner'
                        : 'bg-neutral-900 hover:bg-neutral-800 text-white font-bold'
                    }`}
                  >
                    <i className="fa-regular fa-compass text-base mb-0.5"></i>
                    <span className="text-[10px]">Navegador</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setTabAltech('UTILITATS')}
                    className={`w-full py-2 px-1 rounded flex flex-col items-center justify-center border border-black transition ${
                      tabAltech === 'UTILITATS'
                        ? 'bg-slate-400 text-black font-black shadow-inner'
                        : 'bg-neutral-900 hover:bg-neutral-800 text-white font-bold'
                    }`}
                  >
                    <i className="fa-solid fa-wrench text-base mb-0.5"></i>
                    <span className="text-[10px]">Utilitats</span>
                  </button>
                </div>
              </div>

              {/* Pie Altech + Indicadores GPS/TETRA/5G */}
              <div className="pt-1 border-t border-black/30 text-[9px] font-mono text-black">
                <div className="grid grid-cols-3 gap-0.5 text-center font-black mb-1">
                  <span className="bg-emerald-600 text-white rounded px-0.5">TETRA</span>
                  <span className="bg-emerald-600 text-white rounded px-0.5">5G</span>
                  <span className="bg-emerald-600 text-white rounded px-0.5">GPS</span>
                </div>
                <div className="font-black text-[11px] leading-none">altech</div>
                <div className="text-[8px] mt-0.5">{new Date().toLocaleDateString('es-ES')}</div>
              </div>
            </div>

            {/* ZONA DERECHA DE PANTALLA ALTECH */}
            <div className="col-span-9 sm:col-span-10 flex flex-col justify-between bg-slate-900 relative">
              
              {/* CABECERA DE ESTADO Y PULSADORES RÁPIDOS DE ESTATUS OPERATIVO */}
              <div className="bg-neutral-950 px-2.5 py-1.5 border-b border-slate-700 flex flex-wrap items-center justify-between gap-1.5">
                <div className="flex items-center gap-2">
                  <span className="bg-amber-400 text-black font-black px-2 py-0.5 rounded text-[10px]">
                    {miUnidad?.estado}
                  </span>
                  {infoRuta && (
                    <span className="text-xs font-mono font-bold text-cyan-300">
                      <i className="fa-solid fa-route mr-1"></i>
                      {infoRuta.distanciaKm} km · ETA {infoRuta.minutos} min
                    </span>
                  )}
                </div>

                {/* Pulsadores rápidos de cambio de estado desde el embarcado */}
                <div className="flex flex-wrap gap-1">
                  <button onClick={() => cambiarEstatus('EN_CAMINO', 'En camí')} className="bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">En Camí</button>
                  <button onClick={() => cambiarEstatus('EN_LUGAR', 'Al punt')} className="bg-red-600 hover:bg-red-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">Al Punt</button>
                  <button onClick={() => cambiarEstatus('TRASLADANDO', 'Traslladant')} className="bg-purple-600 hover:bg-purple-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">Traslladant</button>
                  <button onClick={() => cambiarEstatus('EN_HOSPITAL', 'Hospital')} className="bg-blue-600 hover:bg-blue-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">Hospital</button>
                  <button onClick={() => cambiarEstatus('DISPONIBLE', 'QAP Lliure')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">Lliure</button>
                </div>
              </div>

              {/* CONTENIDO SEGÚN PESTAÑA SELECCIONADA EN EL TERMINAL ALTECH */}
              <div className="flex-1 flex flex-col relative overflow-y-auto cad-scroll">
                
                {/* PESTAÑA 1: NAVEGADOR DE EMERGENCIAS + SEMÁFORO INTELIGENTE 5G + LÍMITE 50 */}
                {tabAltech === 'NAVEGADOR' && (
                  <div className="flex-1 relative flex flex-col">
                    {/* Indicadores superpuestos estilo Imagen 1: Semáforo arriba centro + Señal límite 50 derecha */}
                    <div className="absolute top-2 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2">
                      <button
                        type="button"
                        onClick={activarPrioridadSemaforica5G}
                        className="bg-neutral-900/95 border-2 border-slate-500 px-3 py-1 rounded-xl flex items-center gap-2 shadow-xl hover:scale-105 transition"
                        title="Gestió de semàfors intel·ligents 5G Smart Ambulance"
                      >
                        <div className="bg-black p-1 rounded border border-slate-600 flex flex-col gap-0.5">
                          <span className={`w-3 h-3 rounded-full ${!semaforoVerde5G ? 'bg-red-600 shadow-[0_0_8px_red]' : 'bg-red-950'}`}></span>
                          <span className={`w-3 h-3 rounded-full ${semaforoVerde5G ? 'bg-emerald-400 shadow-[0_0_10px_#34d399]' : 'bg-emerald-950'}`}></span>
                        </div>
                        <div className="text-left">
                          <div className="text-[9px] font-bold text-slate-400 uppercase">Semàfor 5G V2X</div>
                          <div className={`text-[10px] font-black ${semaforoVerde5G ? 'text-emerald-400' : 'text-red-400'}`}>
                            {semaforoVerde5G ? 'ONA VERDA ACTIVA' : 'POLSAR PRIORITAT'}
                          </div>
                        </div>
                      </button>
                    </div>

                    {/* Señal de límite de velocidad 50 */}
                    <div className="absolute top-3 right-3 z-20 w-12 h-12 rounded-full bg-white border-4 border-red-600 flex items-center justify-center text-black font-black text-lg shadow-xl">
                      50
                    </div>

                    <MapaGIS
                      incidente={miServicio}
                      unidades={[miUnidad]}
                      rutaPolilinea={rutaCoords}
                      altura="h-full min-h-[360px]"
                    />
                  </div>
                )}

                {/* PESTAÑA 2: INCIDENT (DATOS DEL SERVICIO Y PACIENTE RECIBIDOS DESDE CECOS) */}
                {tabAltech === 'INCIDENT' && (
                  <div className="p-4 space-y-3 text-xs">
                    {miServicio ? (
                      <>
                        <div className="bg-red-950/70 border-2 border-red-600 rounded-xl p-3 flex justify-between items-center">
                          <div>
                            <span className="text-[10px] font-bold text-red-300 uppercase">Servei Actiu Assignat</span>
                            <h3 className="text-base font-black text-white">{miServicio.numFicha} · {miServicio.clasificacion}</h3>
                          </div>
                          <button
                            onClick={() => setTabAltech('NAVEGADOR')}
                            className="bg-amber-400 text-black font-black px-3 py-1.5 rounded-lg text-xs"
                          >
                            <i className="fa-solid fa-diamond-turn-right mr-1"></i>
                            Veure Ruta GPS
                          </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-slate-950 p-3 rounded-xl border border-slate-800">
                          <div><strong className="text-slate-400">Adreça:</strong> <span className="text-white font-bold">{miServicio.direccion}</span></div>
                          <div><strong className="text-slate-400">Municipi:</strong> <span className="text-white">{miServicio.municipio}</span></div>
                          <div><strong className="text-slate-400">Pacient:</strong> <span className="text-white">{miServicio.nombrePac || 'No filiat'} ({miServicio.edad || '?'}a, {miServicio.sexo})</span></div>
                          <div><strong className="text-slate-400">Telèfon Alertant:</strong> <span className="text-amber-300 font-mono">{miServicio.telefono}</span></div>
                          <div className="col-span-2 border-t border-slate-800 pt-2">
                            <strong className="text-cyan-400">Motiu i Triatge CECOS:</strong>
                            <p className="text-slate-200 mt-1">{miServicio.interrogatorio || miServicio.notas}</p>
                          </div>
                        </div>

                        <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2">
                          <div>
                            <div className="text-[11px] font-bold text-slate-400 uppercase">Hospital de Destí per Trasllat:</div>
                            <select
                              value={hospitalDestino.nombre}
                              onChange={e => {
                                const h = DIRECTORIO_CENTROS.find(c => c.nombre === e.target.value);
                                if (h) setHospitalDestino(h);
                              }}
                              className="bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white font-bold mt-1"
                            >

    // =========================================================================
    // 4. EMISORA TETRA / WALKIE-TALKIE PROFESIONAL (DISPLAY LCD + SDS + AUDIO)
    // =========================================================================
    function WalkieTalkieTETRA({
      usuario, mensajesRadio, estadoCanalesTetra, actualizarCanalTetra, enviarMensajeRadio
    }) {
      const [canal, setCanal] = useState('CANAL 1 - EMERGENCIAS');
      const [textoRadio, setTextoRadio] = useState('');
      const [grabando, setGrabando] = useState(false);
      const [reproduciendoVoz, setReproduciendoVoz] = useState(false);
      const [altavozActivo, setAltavozActivo] = useState(true);

      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);
      const lastRadioIdRef = useRef(null);
      const lastTxBannerRef = useRef(null);
      const chatEndRef = useRef(null);

      const miIdentificativo = usuario.indicativo ? `UNIDAD ${usuario.indicativo}` : usuario.user.toUpperCase();
      const canalDocId = canal.replace(/\s+/g, '_');
      const infoCanalVivo = estadoCanalesTetra[canalDocId] || null;

      const canalOcupadoPorOtro = useMemo(() => {
        if (!infoCanalVivo || !infoCanalVivo.transmitiendo) return null;
        if (infoCanalVivo.emisor === miIdentificativo) return null;
        if (Date.now() - (infoCanalVivo.updatedAt || 0) > 20000) return null;
        return infoCanalVivo.emisor;
      }, [infoCanalVivo, miIdentificativo]);

      useEffect(() => {
        if (!altavozActivo || !canalOcupadoPorOtro) return;
        const key = `${canalOcupadoPorOtro}_${infoCanalVivo?.updatedAt}`;
        if (lastTxBannerRef.current !== key) {
          lastTxBannerRef.current = key;
          playTone('ptt_in');
        }
      }, [canalOcupadoPorOtro, altavozActivo]);

      const mensajesFiltrados = mensajesRadio.filter(m => m.canal === canal);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (mensajesFiltrados.length === 0) return;
        const ultimo = mensajesFiltrados[mensajesFiltrados.length - 1];

        if (lastRadioIdRef.current === null) {
          lastRadioIdRef.current = ultimo.id;
          return;
        }

        if (ultimo.id !== lastRadioIdRef.current) {
          lastRadioIdRef.current = ultimo.id;
          if (!altavozActivo || ultimo.emisor === miIdentificativo) return;

          if (ultimo.tipoAlerta === 'PRIORITARIA') {
            playTone('alert_tetra');
          } else if (ultimo.audioBase64) {
            playRadioVoiceBase64(
              ultimo.audioBase64,
              () => setReproduciendoVoz(true),
              () => setReproduciendoVoz(false)
            );
          } else {
            playTone('ptt_out');
          }
        }
      }, [mensajesFiltrados.length, altavozActivo]);

      const iniciarPTT = async () => {
        if (canalOcupadoPorOtro) {
          playTone('ptt_out');
          return;
        }
        unlockAudio();
        playTone('ptt_in');
        setGrabando(true);
        await actualizarCanalTetra(canalDocId, {
          transmitiendo: true,
          emisor: miIdentificativo
        });

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true }
          });
          const mr = new MediaRecorder(stream);
          chunksRef.current = [];
          mr.ondataavailable = (e) => {
            if (e.data.size > 0) chunksRef.current.push(e.data);
          };
          mr.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = async () => {
              await enviarMensajeRadio({
                emisor: miIdentificativo,
                canal,
                texto: '🎙️ Transmisión de voz TETRA',
                audioBase64: reader.result
              });
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorderRef.current = mr;
          mr.start();
        } catch (err) {
          console.warn('Micrófono no disponible:', err);
        }
      };

      const soltarPTT = async () => {
        if (!grabando) return;
        playTone('ptt_out');
        setGrabando(false);
        await actualizarCanalTetra(canalDocId, {
          transmitiendo: false,
          emisor: ''
        });
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
      };

      const enviarSDSRapido = async (codigoSDS) => {
        unlockAudio();
        playTone('ptt_out');
        await enviarMensajeRadio({
          emisor: miIdentificativo,
          canal,
          texto: `[SDS] ${codigoSDS}`
        });
      };

      const enviarAlertaPrioritaria = async () => {
        unlockAudio();
        playTone('alert_tetra');
        await enviarMensajeRadio({
          emisor: miIdentificativo,
          canal,
          tipoAlerta: 'PRIORITARIA',
          texto: '🚨 ALERTA PRIORITARIA EN RED — ATENCIÓN TODAS LAS UNIDADES (QAP)'
        });
      };

      const enviarTextoRadio = async (e) => {
        e.preventDefault();
        if (!textoRadio.trim()) return;
        unlockAudio();
        playTone('ptt_out');
        await enviarMensajeRadio({
          emisor: miIdentificativo,
          canal,
          texto: textoRadio.trim()
        });
        setTextoRadio('');
      };

      return (
        <div className="bg-slate-900 border-2 border-slate-700 rounded-2xl p-3 flex flex-col flex-1 shadow-2xl">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 mb-2 space-y-1.5">
            <div className="flex items-center justify-between text-[10px] font-mono text-emerald-400">
              <span><i className="fa-solid fa-signal mr-1"></i>RESCAT -68dBm</span>
              <span>ISSI: {usuario.issi || '214000'}</span>
              <span><i className="fa-solid fa-battery-full text-emerald-400"></i> 98%</span>
            </div>

            <div className="flex items-center justify-between gap-2 pt-1 border-t border-slate-800">
              <div className="flex items-center gap-2">
                <div className={`w-3.5 h-3.5 rounded-full ${
                  grabando || canalOcupadoPorOtro ? 'bg-red-500 animate-ping' :
                  reproduciendoVoz ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'
                }`}></div>
                <div>
                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Terminal Despacho</div>
                  <div className="text-xs font-black text-emerald-400">CONSOLA TETRA</div>
                </div>
              </div>
              <select
                value={canal}
                onChange={e => setCanal(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-[11px] font-bold text-amber-300"
              >
                <option value="CANAL 1 - EMERGENCIAS">TG-101 EMERGENCIAS</option>
                <option value="CANAL 2 - COORDINACIÓN">TG-102 COORDINACIÓN</option>
                <option value="CANAL 3 - IMV / TÁCTICO">TG-103 TÁCTICO IMV</option>
              </select>
            </div>
          </div>

          <div className="flex items-center justify-between gap-2 mb-2">
            <button
              type="button"
              onClick={() => {
                const next = !altavozActivo;
                setAltavozActivo(next);
                if (next) { unlockAudio(); playTone('ptt_in'); }
              }}
              className={`px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1.5 border transition ${
                altavozActivo
                  ? 'bg-emerald-950 border-emerald-500 text-emerald-300'
                  : 'bg-red-950 border-red-500 text-red-300 animate-pulse'
              }`}
            >
              <i className={`fa-solid ${altavozActivo ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
              {altavozActivo ? 'Altavoz Sala: ON' : 'Activar Altavoz'}
            </button>

            <button
              type="button"
              onClick={enviarAlertaPrioritaria}
              className="bg-red-950 hover:bg-red-800 border border-red-500 text-red-200 px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1"
            >
              <i className="fa-solid fa-triangle-exclamation text-amber-300"></i>
              Tono Alerta
            </button>
          </div>

          {(grabando || canalOcupadoPorOtro || reproduciendoVoz) && (
            <div className={`mb-2 px-3 py-1.5 rounded-lg font-mono text-xs font-black flex items-center justify-between ${
              grabando ? 'bg-red-600 text-white' :
              canalOcupadoPorOtro ? 'bg-red-950 border border-red-500 text-red-300' :
              'bg-amber-950 border border-amber-500 text-amber-300'
            }`}>
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                <span>
                  {grabando && `TX EN CURSO (${miIdentificativo})`}
                  {canalOcupadoPorOtro && `CANAL OCUPADO: ${canalOcupadoPorOtro}`}
                  {!grabando && !canalOcupadoPorOtro && reproduciendoVoz && 'RX AUDIO EN DIRECTO...'}
                </span>
              </div>
              <div className="flex items-end gap-0.5 h-3.5">
                <span className="w-1 bg-current eq-animate-1"></span>
                <span className="w-1 bg-current eq-animate-2"></span>
                <span className="w-1 bg-current eq-animate-3"></span>
                <span className="w-1 bg-current eq-animate-4"></span>
              </div>
            </div>
          )}

          <div className="flex-1 tetra-lcd border-2 border-slate-700 rounded-xl p-2.5 overflow-y-auto cad-scroll max-h-[240px] space-y-2 font-mono text-xs">
            {mensajesFiltrados.length === 0 ? (
              <div className="text-emerald-500/70 text-center py-8 text-[11px]">
                -- FRECUENCIA EN ESCUCHA ({canal}) --<br />
                Mantén pulsado PTT para hablar a toda la sala
              </div>
            ) : (
              mensajesFiltrados.map(m => (
                <div
                  key={m.id}
                  className={`rounded p-2 border ${
                    m.tipoAlerta === 'PRIORITARIA'
                      ? 'bg-red-950/90 border-red-500 text-red-100'
                      : 'bg-black/45 border-emerald-900/60'
                  }`}
                >
                  <div className="flex justify-between text-[10px] text-emerald-400 font-bold mb-0.5">
                    <span>{m.emisor}</span>
                    <span>{m.hora}</span>
                  </div>
                  <div className="text-emerald-100">{m.texto}</div>
                  {m.audioBase64 && (
                    <button
                      type="button"
                      onClick={() => playRadioVoiceBase64(m.audioBase64)}
                      className="mt-1.5 bg-emerald-900/80 hover:bg-emerald-800 border border-emerald-600 text-emerald-200 px-2.5 py-1 rounded text-[11px] font-bold flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-play"></i>
                      Repetir transmisión radio
                    </button>
                  )}
                </div>
              ))
            )}
            <div ref={chatEndRef} />
          </div>

          <div className="grid grid-cols-4 gap-1 mt-2">
            {['10-4 Recibido', 'QAP Escucha', 'Solicito SVA', 'Clave 0 PCR'].map(sds => (
              <button
                key={sds}
                type="button"
                onClick={() => enviarSDSRapido(sds)}
                className="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-emerald-300 font-mono text-[10px] font-bold py-1 rounded truncate px-1"
              >
                {sds}
              </button>
            ))}
          </div>

          <div className="mt-2 space-y-2">
            <button
              type="button"
              disabled={!!canalOcupadoPorOtro}
              onMouseDown={iniciarPTT}
              onMouseUp={soltarPTT}
              onMouseLeave={soltarPTT}
              onTouchStart={iniciarPTT}
              onTouchEnd={soltarPTT}
              className={`w-full py-3.5 rounded-xl font-black text-sm tracking-wider uppercase transition flex items-center justify-center gap-2 shadow-lg ${
                canalOcupadoPorOtro
                  ? 'bg-slate-800 text-red-400 border border-red-800 cursor-not-allowed'
                  : grabando
                  ? 'bg-red-600 text-white ring-4 ring-red-500/40 scale-[0.99]'

    // =========================================================================
    // 5. MODAL DE CONFIGURACIÓN DE RED DEL AULA
    // =========================================================================
    function ModalConfigRed({ firebaseConfig, onSave, onClose }) {
      const [rawText, setRawText] = useState(
        firebaseConfig ? JSON.stringify(firebaseConfig, null, 2) : ''
      );

      const magicLink = useMemo(() => {
        if (!firebaseConfig) return '';
        const base = window.location.origin + window.location.pathname;
        return `${base}?cfg=${btoa(JSON.stringify(firebaseConfig))}`;
      }, [firebaseConfig]);

      const procesarYGuardar = () => {
        if (!rawText.trim()) {
          onSave(null);
          return;
        }
        try {
          const match = rawText.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('No se encontró objeto');
          const jsonStr = match[0]
            .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');
          const parsed = JSON.parse(jsonStr);
          if (!parsed.apiKey || !parsed.projectId) throw new Error('Faltan campos');
          onSave(parsed);
        } catch (e) {
          alert('No se pudo leer la configuración. Pega el objeto firebaseConfig completo.');
        }
      };

      const copiarEnlace = () => {
        navigator.clipboard.writeText(magicLink);
        alert('¡Enlace Mágico copiado! Compártelo con tus alumnos.');
      };

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-xl w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center border-b border-slate-800 pb-2">
              <h3 className="font-bold text-base text-white">
                <i className="fa-solid fa-network-wired text-emerald-400 mr-2"></i>
                Configuración de Red del Aula (Firebase)
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <textarea
              rows="6"
              placeholder={'{\n  apiKey: "AIzaSy...",\n  authDomain: "cecos-aula.firebaseapp.com",\n  projectId: "cecos-aula"\n}'}
              value={rawText}
              onChange={e => setRawText(e.target.value)}
              className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 font-mono text-xs text-emerald-300"
            ></textarea>

            {magicLink && (
              <div className="bg-emerald-950/60 border border-emerald-600 rounded-lg p-3 space-y-1.5">
                <div className="text-xs font-bold text-emerald-300">
                  Enlace Mágico para alumnos:
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    readOnly
                    value={magicLink}
                    className="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] font-mono text-slate-300"
                  />
                  <button
                    onClick={copiarEnlace}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold"
                  >
                    Copiar
                  </button>
                </div>
              </div>
            )}

            <div className="flex justify-between pt-2">
              <button
                onClick={() => onSave(null)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded text-xs font-bold"
              >
                Usar Modo Local (1 PC)
              </button>
              <div className="flex gap-2">
                <button
                  onClick={onClose}
                  className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded text-xs font-bold"
                >
                  Cancelar
                </button>
                <button
                  onClick={procesarYGuardar}
                  className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-xs font-bold"
                >
                  Guardar y Conectar Aula
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
