    // MOTOR DE AUDIO GLOBAL (TONOS DTMF + TONOS TETRA + VOZ FILTRADA)
    // =========================================================================
    let sharedAudioCtx = null;

    const unlockAudio = () => {
      try {
        if (!sharedAudioCtx) {
          sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume();
        }
        return true;
      } catch (e) {
        return false;
      }
    };

    const DTMF_FREQS = {
      '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
      '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
      '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
      '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
    };

    const playDTMF = (digit) => {
      try {
        unlockAudio();
        const freqs = DTMF_FREQS[digit];
        if (!freqs || !sharedAudioCtx) return;
        const now = sharedAudioCtx.currentTime;
        freqs.forEach(f => {
          const osc = sharedAudioCtx.createOscillator();
          const gain = sharedAudioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(sharedAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        });
      } catch (e) {}
    };

    const playTone = (type) => {
      try {
        unlockAudio();
        const ctx = sharedAudioCtx;
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'ptt_in') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1150, now);
          osc.frequency.setValueAtTime(1520, now + 0.055);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'ptt_out') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.setValueAtTime(660, now + 0.065);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.17);
        } else if (type === 'alert_tetra') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1180, now + 0.15);
          osc.frequency.setValueAtTime(880, now + 0.30);
          osc.frequency.setValueAtTime(1180, now + 0.45);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          osc.start(now);
          osc.stop(now + 0.66);
        } else if (type === 'ring') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(425, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.56);
        }
      } catch (e) {}
    };

    const playRadioVoiceBase64 = (base64Data, onStartCb, onEndCb) => {
      try {
        unlockAudio();
        playTone('ptt_in');
        const audio = new Audio(base64Data);
        audio.volume = 1.0;

        if (sharedAudioCtx) {
          try {
            const source = sharedAudioCtx.createMediaElementSource(audio);
            const highpass = sharedAudioCtx.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 320;

            const lowpass = sharedAudioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 2900;

            const compressor = sharedAudioCtx.createDynamicsCompressor();
            compressor.threshold.value = -24;
            compressor.ratio.value = 6;

            source.connect(highpass);
            highpass.connect(lowpass);
            lowpass.connect(compressor);
            compressor.connect(sharedAudioCtx.destination);
          } catch (filterErr) {}
        }

        if (onStartCb) onStartCb();
        audio.onended = () => {
          playTone('ptt_out');
          if (onEndCb) onEndCb();
        };
        audio.onerror = () => {
          if (onEndCb) onEndCb();
        };
        audio.play().catch(() => {
          if (onEndCb) onEndCb();
        });
      } catch (e) {
        if (onEndCb) onEndCb();
      }
    };

    // =========================================================================
    // COMPONENTE REUTILIZABLE: VISOR MAPA GIS TÁCTICO CON RUTAS REALES OSRM
    // =========================================================================
    function MapaGIS({
      incidente,
      unidades = [],
      coordenadasSeleccionadas,
      onSeleccionarPunto,
      rutaPolilinea = null,
      altura = 'h-64'
    }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const layerGroupRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current || !window.L) return;
        const initLat = incidente?.lat || coordenadasSeleccionadas?.lat || 41.3874;
        const initLng = incidente?.lng || coordenadasSeleccionadas?.lng || 2.1686;

        const map = window.L.map(mapContainerRef.current).setView([initLat, initLng], 15);
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap | GIS CAT112'
        }).addTo(map);

        const group = window.L.layerGroup().addTo(map);
        mapInstanceRef.current = map;
        layerGroupRef.current = group;

        if (onSeleccionarPunto) {
          map.on('click', (e) => {
            onSeleccionarPunto({
              lat: Number(e.latlng.lat.toFixed(6)),
              lng: Number(e.latlng.lng.toFixed(6)),
              precision: 10
            });
          });
        }

        setTimeout(() => map.invalidateSize(), 250);

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      useEffect(() => {
        const map = mapInstanceRef.current;
        const group = layerGroupRef.current;
        if (!map || !group || !window.L) return;

        group.clearLayers();

        // Dibujar ruta real si existe
        if (rutaPolilinea && rutaPolilinea.length > 1) {
          const poly = window.L.polyline(rutaPolilinea, {
            color: '#2563eb',
            weight: 6,
            opacity: 0.9
          }).addTo(group);
          window.L.polyline(rutaPolilinea, {
            color: '#ffffff',
            weight: 2,
            dashArray: '8, 8',
            opacity: 0.95
          }).addTo(group);
          map.fitBounds(poly.getBounds(), { padding: [30, 30] });
        }

        const targetLat = incidente?.lat || coordenadasSeleccionadas?.lat;
        const targetLng = incidente?.lng || coordenadasSeleccionadas?.lng;
        const precision = incidente?.precision || coordenadasSeleccionadas?.precision || 15;

        if (targetLat && targetLng) {
          window.L.circle([targetLat, targetLng], {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.18,
            radius: precision
          }).addTo(group);

          const incIcon = window.L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background:#dc2626;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 0 10px rgba(220,38,38,0.9);font-weight:bold;font-size:11px;">112</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          window.L.marker([targetLat, targetLng], { icon: incIcon })
            .bindPopup(`<strong>${incidente?.numFicha || 'Ubicación Alertante'}</strong><br/>${incidente?.direccion || 'Punto AML'}<br/>Precisión AML: ±${precision}m`)
            .addTo(group);

          if (!rutaPolilinea) {
            map.setView([targetLat, targetLng], 15);
          }
        }

        unidades.forEach(u => {
          if (!u.lat || !u.lng) return;
          const color = u.estado === 'DISPONIBLE' ? '#059669' : '#d97706';
          const uIcon = window.L.divIcon({
            className: 'custom-unit-icon',
            html: `<div style="background:${color};color:white;padding:2px 6px;border-radius:6px;border:2px solid white;font-size:10px;font-weight:900;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.6);">🚑 ${u.id}</div>`,
            iconSize: [54, 22],
            iconAnchor: [27, 11]
          });
          window.L.marker([u.lat, u.lng], { icon: uIcon })
            .bindPopup(`<strong>${u.id} (${u.tipo})</strong><br/>Estado: ${u.estado}<br/>${u.base}`)
            .addTo(group);
        });
      }, [incidente, unidades, coordenadasSeleccionadas, rutaPolilinea]);

      return (
        <div className={`w-full ${altura} rounded-lg overflow-hidden border border-slate-700 relative`}>
          <div ref={mapContainerRef} className="w-full h-full"></div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE DE VOZ TELEFÓNICA BIDIRECCIONAL (ALERTANTE <-> OPERADOR 112)
    // =========================================================================
    function LineaTelefonicaVoz({
      incidente,
      rolEnLlamada,
      nombreEmisor,
      enviarAudioOTextoLlamada,
      compacto = false
    }) {
      const [grabando, setGrabando] = useState(false);
      const [textoMsg, setTextoMsg] = useState('');
      const [autoPlay, setAutoPlay] = useState(true);
      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);
      const lastPlayedIdRef = useRef(null);
      const endRef = useRef(null);

      const mensajes = incidente?.mensajesLlamada || [];

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (!autoPlay || mensajes.length === 0) return;
        const ultimo = mensajes[mensajes.length - 1];
        if (ultimo.id !== lastPlayedIdRef.current && ultimo.rol !== rolEnLlamada && ultimo.audioBase64) {
          lastPlayedIdRef.current = ultimo.id;
          try {
            unlockAudio();
            const audio = new Audio(ultimo.audioBase64);
            audio.play().catch(() => {});
          } catch (e) {}
        }
      }, [mensajes.length]);

      const iniciarVoz = async () => {
        unlockAudio();
        playTone('ptt_in');
        setGrabando(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mr = new MediaRecorder(stream);
          chunksRef.current = [];
          mr.ondataavailable = (e) => {
            if (e.data.size > 0) chunksRef.current.push(e.data);
          };
          mr.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = async () => {
              await enviarAudioOTextoLlamada({
                id: 'tel_' + Date.now(),
                rol: rolEnLlamada,
                emisor: nombreEmisor,
                hora: new Date().toLocaleTimeString('es-ES'),
                texto: '📞 Voz en línea telefónica',
                audioBase64: reader.result
              });
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorderRef.current = mr;
          mr.start();
        } catch (err) {
          alert('No se detectó micrófono o no diste permiso en el navegador.');
          setGrabando(false);
        }
      };

      const detenerVoz = () => {
        if (!grabando) return;
        playTone('ptt_out');
        setGrabando(false);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
      };

      const enviarTexto = async (e) => {
        e.preventDefault();
        if (!textoMsg.trim()) return;
        await enviarAudioOTextoLlamada({
          id: 'tel_' + Date.now(),
          rol: rolEnLlamada,
          emisor: nombreEmisor,
          hora: new Date().toLocaleTimeString('es-ES'),
          texto: textoMsg.trim()
        });
        setTextoMsg('');
      };

      return (
        <div className="bg-slate-900 border border-blue-500/60 rounded-xl p-2.5 space-y-2 text-slate-100">
          <div className="flex items-center justify-between border-b border-slate-800 pb-1">
            <div className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              <span className="text-[11px] font-black text-blue-300 uppercase">
                Audio Línea 112 ({incidente.telefono})
              </span>
            </div>
            <label className="flex items-center gap-1 text-[10px] text-slate-400 cursor-pointer">
              <input
                type="checkbox"
                checked={autoPlay}
                onChange={e => setAutoPlay(e.target.checked)}
              />
              Auto-voz
            </label>
          </div>

          <div className={`bg-slate-950 rounded-lg p-2 ${compacto ? 'max-h-24' : 'max-h-40'} overflow-y-auto cad-scroll space-y-1.5 text-xs`}>
            {mensajes.length === 0 ? (
              <div className="text-slate-500 text-center py-2 text-[11px]">
                Línea abierta. Mantén pulsado el botón azul para hablar con el alertante.
              </div>
            ) : (
              mensajes.map(m => (
                <div
                  key={m.id}
                  className={`p-1.5 rounded ${
                    m.rol === rolEnLlamada
                      ? 'bg-blue-950/80 border border-blue-800 ml-4'
                      : 'bg-slate-800 border border-slate-700 mr-4'
                  }`}
                >
                  <div className="flex justify-between text-[10px] text-slate-400 font-bold">
                    <span>{m.emisor}</span>
                    <span>{m.hora}</span>
                  </div>
                  <div className="text-white text-[11px]">{m.texto}</div>
                  {m.audioBase64 && (
                    <audio controls src={m.audioBase64} className="w-full h-6 mt-1" />
                  )}
                </div>
              ))
            )}
            <div ref={endRef} />
          </div>

          <button
            type="button"
            onMouseDown={iniciarVoz}
            onMouseUp={detenerVoz}
            onMouseLeave={detenerVoz}
            onTouchStart={iniciarVoz}
            onTouchEnd={detenerVoz}
            className={`w-full py-2 rounded-lg font-black text-[11px] uppercase flex items-center justify-center gap-1.5 transition ${
              grabando
                ? 'bg-red-600 text-white animate-pulse ring-2 ring-red-400'
                : 'bg-blue-600 hover:bg-blue-500 text-white'
            }`}
          >
            <i className="fa-solid fa-microphone"></i>
            {grabando ? 'HABLANDO... SUELTA PARA ENVIAR' : 'PULSAR PARA HABLAR POR TELÉFONO'}
          </button>

          <form onSubmit={enviarTexto} className="flex gap-1">
            <input
              type="text"
              placeholder="Interrogatorio escrito..."
              value={textoMsg}
              onChange={e => setTextoMsg(e.target.value)}
              className="flex-1 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-white"
            />
            <button
              type="submit"
              className="bg-slate-700 hover:bg-slate-600 text-white px-2.5 py-1 rounded text-[11px] font-bold"
            >
              Enviar
            </button>
          </form>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE PRINCIPAL
    // =========================================================================
    function App() {
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const cfgParam = urlParams.get('cfg');
          if (cfgParam) {
            const decoded = JSON.parse(atob(cfgParam));
            localStorage.setItem('cecos_fb_config', JSON.stringify(decoded));
            return decoded;
          }
          const saved = localStorage.getItem('cecos_fb_config');
          return saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CONFIG;
        } catch (e) {
          return DEFAULT_FIREBASE_CONFIG;
        }
      });

      const [sdkReady, setSdkReady] = useState(!!window.FirebaseSDK);
      const [dbInstance, setDbInstance] = useState(null);
      const [netStatus, setNetStatus] = useState('LOCAL');
      const [showConfigModal, setShowConfigModal] = useState(false);

      const [vistaPrincipal, setVistaPrincipal] = useState('CECOS');
      const [usuarioActual, setUsuarioActual] = useState(null);

      const [incidentes, setIncidentes] = useState([]);
      const [unidades, setUnidades] = useState(UNIDADES_INICIALES);
      const [mensajesRadio, setMensajesRadio] = useState([]);
      const [estadoCanalesTetra, setEstadoCanalesTetra] = useState({});

      useEffect(() => {
        const handleFirstInteraction = () => unlockAudio();
        window.addEventListener('pointerdown', handleFirstInteraction, { once: true });
        return () => window.removeEventListener('pointerdown', handleFirstInteraction);
      }, []);

      useEffect(() => {
        if (window.FirebaseSDK) {
          setSdkReady(true);
          return;
        }
        const onReady = () => setSdkReady(true);
        window.addEventListener('firebase-sdk-ready', onReady);
        return () => window.removeEventListener('firebase-sdk-ready', onReady);
      }, []);

      useEffect(() => {
        if (!firebaseConfig) {
          setNetStatus('LOCAL');
          cargarDatosLocales();
          return;
        }
        if (!sdkReady) {
          setNetStatus('CONNECTING');
          return;
        }

        let unsubInc = null;
        let unsubUni = null;
        let unsubRad = null;
        let unsubCh = null;

        const initCloud = async () => {
          setNetStatus('CONNECTING');
          try {
            const {
              initializeApp, getApps, getAuth, signInAnonymously,
              getFirestore, collection, onSnapshot, query, orderBy, doc, setDoc, getDocs
            } = window.FirebaseSDK;

            const app = getApps().length > 0 ? getApps()[0] : initializeApp(firebaseConfig);
            const auth = getAuth(app);
            await signInAnonymously(auth);
            const db = getFirestore(app);
            setDbInstance(db);
            setNetStatus('CLOUD');

            const uniSnap = await getDocs(collection(db, 'cecos_unidades'));
            if (uniSnap.empty) {
              for (const u of UNIDADES_INICIALES) {
                await setDoc(doc(db, 'cecos_unidades', u.id), u);
              }
            }

            unsubInc = onSnapshot(query(collection(db, 'cecos_incidentes'), orderBy('timestamp', 'desc')), (snap) => {
              setIncidentes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });

            unsubUni = onSnapshot(collection(db, 'cecos_unidades'), (snap) => {
              if (!snap.empty) {
                setUnidades(snap.docs.map(d => ({ id: d.id, ...d.data() })));
              }
            });

            unsubRad = onSnapshot(query(collection(db, 'cecos_radio'), orderBy('timestamp', 'asc')), (snap) => {
              setMensajesRadio(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });

            unsubCh = onSnapshot(collection(db, 'cecos_canales_tetra'), (snap) => {
              const map = {};
              snap.docs.forEach(d => { map[d.id] = d.data(); });
              setEstadoCanalesTetra(map);
            });
          } catch (err) {
            console.error('Error conectando Firebase:', err);
            setNetStatus('LOCAL');
            cargarDatosLocales();
          }
        };

        initCloud();
        return () => {
          if (unsubInc) unsubInc();
          if (unsubUni) unsubUni();
          if (unsubRad) unsubRad();
          if (unsubCh) unsubCh();
        };
      }, [firebaseConfig, sdkReady]);

      const cargarDatosLocales = () => {
        try {
          const inc = JSON.parse(localStorage.getItem('cecos_local_inc') || '[]');
          const uni = JSON.parse(localStorage.getItem('cecos_local_uni') || 'null');
          const rad = JSON.parse(localStorage.getItem('cecos_local_rad') || '[]');
          const ch = JSON.parse(localStorage.getItem('cecos_local_ch') || '{}');
          setIncidentes(inc);
          setUnidades(uni || UNIDADES_INICIALES);
          setMensajesRadio(rad);
          setEstadoCanalesTetra(ch);
        } catch (e) {}
      };

      useEffect(() => {
        if (netStatus !== 'LOCAL') return;
        const onStorage = (e) => {
          if (e.key && e.key.startsWith('cecos_local_')) cargarDatosLocales();
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, [netStatus]);

      const actualizarCanalTetra = async (canalId, data) => {
        const payload = { ...data, updatedAt: Date.now() };
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, setDoc } = window.FirebaseSDK;
          await setDoc(doc(dbInstance, 'cecos_canales_tetra', canalId), payload);
        } else {
          const next = { ...estadoCanalesTetra, [canalId]: payload };
          setEstadoCanalesTetra(next);
          localStorage.setItem('cecos_local_ch', JSON.stringify(next));
        }
      };

      const crearIncidente = async (nuevoInc) => {
        const numFicha = 'CAT-' + Math.floor(100000 + Math.random() * 900000);
        const now = new Date();
        const payload = {
          ...nuevoInc,
          numFicha,
          fecha: now.toLocaleDateString('es-ES'),
          horaLlamada: now.toLocaleTimeString('es-ES'),
          horaTraspaso: '',
          estado: 'LLAMADA_ENTRANTE',
          operadorDemanda: '',
          gestorRespuesta: '',
          tipoDemanda: '',
          interrogatorio: '',
          clasificacion: '',
          agenciasNotificadas: ['061 SEM'],
          consejoAlertante: '',
          hacerSala: '',
          recursosAsignados: [],
          mensajesLlamada: [],
          constantesVitales5G: null,
          cronologia: [
            {
              hora: now.toLocaleTimeString('es-ES'),
              texto: `Llamada entrante en ${nuevoInc.linea || '112'} desde ${nuevoInc.telefono} | AML GPS: ${nuevoInc.lat}, ${nuevoInc.lng} (±${nuevoInc.precision}m)`
            }
          ],
          timestamp: Date.now()
        };

        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, addDoc } = window.FirebaseSDK;
          const ref = await addDoc(collection(dbInstance, 'cecos_incidentes'), payload);
          return { id: ref.id, ...payload };
        } else {
          const item = { id: 'loc_' + Date.now(), ...payload };
          const lista = [item, ...incidentes];
          setIncidentes(lista);
          localStorage.setItem('cecos_local_inc', JSON.stringify(lista));
          return item;
        }
      };

      const actualizarIncidente = async (id, cambios) => {
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, updateDoc } = window.FirebaseSDK;
          await updateDoc(doc(dbInstance, 'cecos_incidentes', id), cambios);
        } else {
          const lista = incidentes.map(inc => inc.id === id ? { ...inc, ...cambios } : inc);
          setIncidentes(lista);
          localStorage.setItem('cecos_local_inc', JSON.stringify(lista));
        }
      };

      const eliminarIncidente = async (id) => {
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, deleteDoc } = window.FirebaseSDK;
          await deleteDoc(doc(dbInstance, 'cecos_incidentes', id));
        } else {
          const lista = incidentes.filter(inc => inc.id !== id);
          setIncidentes(lista);
          localStorage.setItem('cecos_local_inc', JSON.stringify(lista));
        }
      };

      const actualizarUnidad = async (unidadId, cambios) => {
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, updateDoc } = window.FirebaseSDK;
          await updateDoc(doc(dbInstance, 'cecos_unidades', unidadId), cambios);
        } else {
          const lista = unidades.map(u => u.id === unidadId ? { ...u, ...cambios } : u);
          setUnidades(lista);
          localStorage.setItem('cecos_local_uni', JSON.stringify(lista));
        }
      };

      const enviarMensajeRadio = async (msg) => {
        const payload = {
          ...msg,
          hora: new Date().toLocaleTimeString('es-ES'),
          timestamp: Date.now()
        };
        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, addDoc } = window.FirebaseSDK;
          await addDoc(collection(dbInstance, 'cecos_radio'), payload);
        } else {
          const lista = [...mensajesRadio, { id: 'rad_' + Date.now(), ...payload }];
          setMensajesRadio(lista);
          localStorage.setItem('cecos_local_rad', JSON.stringify(lista));
        }
      };

      const reiniciarSimulacion = async () => {
        if (!confirm('¿Seguro que deseas borrar todos los incidentes, mensajes de radio y devolver las ambulancias a sus bases?')) return;
        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, getDocs, deleteDoc, doc, setDoc } = window.FirebaseSDK;
          const incSnap = await getDocs(collection(dbInstance, 'cecos_incidentes'));
          for (const d of incSnap.docs) await deleteDoc(doc(dbInstance, 'cecos_incidentes', d.id));
          const radSnap = await getDocs(collection(dbInstance, 'cecos_radio'));
          for (const d of radSnap.docs) await deleteDoc(doc(dbInstance, 'cecos_radio', d.id));
          const chSnap = await getDocs(collection(dbInstance, 'cecos_canales_tetra'));
          for (const d of chSnap.docs) await deleteDoc(doc(dbInstance, 'cecos_canales_tetra', d.id));
          for (const u of UNIDADES_INICIALES) await setDoc(doc(dbInstance, 'cecos_unidades', u.id), u);
        } else {
          localStorage.removeItem('cecos_local_inc');
          localStorage.removeItem('cecos_local_rad');
          localStorage.removeItem('cecos_local_ch');
          localStorage.setItem('cecos_local_uni', JSON.stringify(UNIDADES_INICIALES));
          setIncidentes([]);
          setMensajesRadio([]);
          setEstadoCanalesTetra({});
          setUnidades(UNIDADES_INICIALES);
        }
      };

      const llamadasEntrantes = incidentes.filter(i => i.estado === 'LLAMADA_ENTRANTE').length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* BARRA SUPERIOR GLOBAL */}
          <header className="bg-slate-900 border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="bg-red-600 text-white font-black px-2.5 py-1 rounded text-sm tracking-wider shadow">
                CAT112 / 061
              </div>
              <div>
                <h1 className="font-bold text-sm md:text-base text-white leading-tight">
                  SIMULADOR CECOS — TELEEMERGENCIAS CAD, EMBARCAT SEM & RESCAT
                </h1>
                <p className="text-[11px] text-slate-400">CFGM Emergències Sanitàries · Sistema Despatx + Terminal Embarcat Altech 5G + Xarxa TETRA</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => { unlockAudio(); setVistaPrincipal('ALERTANTE'); }}
                className={`px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 transition ${
                  vistaPrincipal === 'ALERTANTE'
                    ? 'bg-red-600 text-white shadow-lg shadow-red-600/30'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                <i className="fa-solid fa-phone-volume"></i>
                Teléfono Alertante (112/061)
              </button>

              <button
                onClick={() => { unlockAudio(); setVistaPrincipal('CECOS'); }}
                className={`px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 transition relative ${
                  vistaPrincipal === 'CECOS'
                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                <i className="fa-solid fa-headset"></i>
                Consola Sala CECOS / Embarcat
                {llamadasEntrantes > 0 && (
                  <span className="ml-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full animate-bounce">
                    {llamadasEntrantes}
                  </span>
                )}
              </button>

              <button
                onClick={() => setShowConfigModal(true)}
                className={`px-2.5 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 border ${
                  netStatus === 'CLOUD'
                    ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300'
                    : netStatus === 'CONNECTING'
                    ? 'bg-blue-950/80 border-blue-500 text-blue-300'
                    : 'bg-amber-950/80 border-amber-600 text-amber-300'
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${
                  netStatus === 'CLOUD' ? 'bg-emerald-400 animate-pulse' :
                  netStatus === 'CONNECTING' ? 'bg-blue-400 animate-ping' : 'bg-amber-400'
                }`}></span>
                {netStatus === 'CLOUD' ? 'Red Aula Activa' : netStatus === 'CONNECTING' ? 'Conectando...' : 'Modo Local (1 PC)'}
              </button>
            </div>
          </header>

          <main className="flex-1 flex flex-col">
            {vistaPrincipal === 'ALERTANTE' ? (
              <PortalAlertante
                crearIncidente={crearIncidente}
                actualizarIncidente={actualizarIncidente}
                incidentes={incidentes}
                unidades={unidades}
              />
            ) : !usuarioActual ? (
              <LoginCECOS onLogin={(u) => { unlockAudio(); setUsuarioActual(u); }} />
            ) : (
              <SalaCECOS
                usuario={usuarioActual}
                onLogout={() => setUsuarioActual(null)}
                incidentes={incidentes}
                unidades={unidades}
                mensajesRadio={mensajesRadio}
                estadoCanalesTetra={estadoCanalesTetra}
                actualizarCanalTetra={actualizarCanalTetra}
                actualizarIncidente={actualizarIncidente}
                eliminarIncidente={eliminarIncidente}
                actualizarUnidad={actualizarUnidad}
                enviarMensajeRadio={enviarMensajeRadio}
                reiniciarSimulacion={reiniciarSimulacion}
              />
            )}
          </main>

          {showConfigModal && (
            <ModalConfigRed
              firebaseConfig={firebaseConfig}
              onSave={(cfg) => {
                if (cfg) {
                  localStorage.setItem('cecos_fb_config', JSON.stringify(cfg));
                } else {
                  localStorage.removeItem('cecos_fb_config');
                }
                setFirebaseConfig(cfg);
                setShowConfigModal(false);
              }}
              onClose={() => setShowConfigModal(false)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // 1. PORTAL DEL ALERTANTE (GEOCODING INVERSO + TECLADO DTMF + ROLEPLAY)
    // =========================================================================
    function PortalAlertante({ crearIncidente, actualizarIncidente, incidentes, unidades }) {
      const [linea, setLinea] = useState('112');
      const [telefono, setTelefono] = useState('6' + Math.floor(10000000 + Math.random() * 89999999));
      const [alertante, setAlertante] = useState('');
      const [municipio, setMunicipio] = useState('Barcelona');
      const [poblacion, setPoblacion] = useState('');
      const [direccion, setDireccion] = useState('');
      const [notas, setNotas] = useState('');
      const [guionActivo, setGuionActivo] = useState([]);
      const [modoInterrogatorioReal, setModoInterrogatorioReal] = useState(true);
      const [nombrePac, setNombrePac] = useState('');
      const [edad, setEdad] = useState('');
      const [sexo, setSexo] = useState('H');
      const [coords, setCoords] = useState({ lat: 41.3874, lng: 2.1686, precision: 18 });
      const [gpsStatus, setGpsStatus] = useState('Haz clic en el mapa o pulsa "Usar mi GPS Real"');
      const [buscandoDir, setBuscandoDir] = useState(false);
      const [llamadaActivaId, setLlamadaActivaId] = useState(null);
      const [segundosLlamada, setSegundosLlamada] = useState(0);

      const llamadaActual = useMemo(
        () => incidentes.find(i => i.id === llamadaActivaId),
        [incidentes, llamadaActivaId]
      );

      useEffect(() => {
        if (!llamadaActual) {
          setSegundosLlamada(0);
          return;
        }
        const timer = setInterval(() => {
          setSegundosLlamada(s => s + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [llamadaActual?.id]);

      const formatTimer = (sec) => {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      const resolverDireccionDesdeCoords = async (lat, lng, precision) => {
        setCoords({ lat, lng, precision });
        setGpsStatus(`Obteniendo calle desde coordenadas AML (±${precision}m)...`);
        try {
          const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=es`);
          const data = await resp.json();
          if (data && data.address) {
            const road = data.address.road || data.address.pedestrian || data.address.square || '';
            const num = data.address.house_number ? `, ${data.address.house_number}` : '';
            const city = data.address.city || data.address.town || data.address.village || data.address.municipality || 'Barcelona';
            const suburb = data.address.suburb || data.address.neighbourhood || '';
            if (road) setDireccion(`${road}${num}`);
            if (city) setMunicipio(city);
            if (suburb) setPoblacion(suburb);
            setGpsStatus(`AML fijado: ${road}${num} (${city}) · ±${precision}m`);
          } else {
            setGpsStatus(`Punto AML fijado: ${lat}, ${lng} (±${precision}m)`);
          }
        } catch (e) {
          setGpsStatus(`Coordenadas AML fijadas: ${lat}, ${lng} (±${precision}m)`);
        }
      };

      const buscarDireccionEnMapa = async () => {
        if (!direccion.trim()) return;
        setBuscandoDir(true);
        try {
          const q = encodeURIComponent(`${direccion}, ${municipio}, Catalunya`);
          const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
          const results = await resp.json();
          if (results && results.length > 0) {
            const lat = Number(parseFloat(results[0].lat).toFixed(6));
            const lng = Number(parseFloat(results[0].lon).toFixed(6));
            setCoords({ lat, lng, precision: 12 });
            setGpsStatus(`Dirección localizada en GIS: ${lat}, ${lng} (±12m)`);
          } else {
            setGpsStatus('No se encontró esa calle exacta; haz clic en el mapa.');
          }
        } catch (e) {}
        setBuscandoDir(false);
      };

      const obtenerGPSReal = () => {
        if (!navigator.geolocation) {
          setGpsStatus('Tu navegador no soporta GPS.');
          return;
        }
        setGpsStatus('Conectando satélites GPS AML...');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolverDireccionDesdeCoords(
              Number(pos.coords.latitude.toFixed(6)),
              Number(pos.coords.longitude.toFixed(6)),
              Math.round(pos.coords.accuracy || 15)
            );
          },
          () => {
            setGpsStatus('Permiso denegado. Haz clic directamente sobre el mapa.');
          },
          { enableHighAccuracy: true }
        );
      };

      const cargarCaso = (caso) => {
        setTelefono(caso.telefono);
        setAlertante(caso.alertante);
        setMunicipio(caso.municipio);
        setPoblacion(caso.poblacion);
        setDireccion(caso.direccion);
        setNotas(caso.notas);
        setGuionActivo(caso.guionRoleplay || []);
        setNombrePac(caso.nombrePac);
        setEdad(caso.edad);
        setSexo(caso.sexo);
        setCoords({ lat: caso.lat, lng: caso.lng, precision: caso.precision });
        setGpsStatus(`Supuesto AML cargado: ${caso.direccion} (±${caso.precision}m)`);
      };

      const marcarDigito = (d) => {
        playDTMF(d);
        if (linea.length >= 3) {
          setLinea(d);
        } else {
          setLinea(prev => prev + d);
        }
      };

      const realizarLlamada = async (e) => {
        e.preventDefault();
        if (!direccion.trim()) {
          alert('Indica o marca en el mapa la ubicación del incidente.');
          return;
        }
        if (!modoInterrogatorioReal && !notas.trim()) {
          alert('Explica qué está ocurriendo o activa el modo interrogatorio por voz.');
          return;
        }
        unlockAudio();
        playTone('ring');

        const inc = await crearIncidente({
          linea: linea || '112',
          telefono,
          telefonoPaciente: '',
          alertante: modoInterrogatorioReal ? '' : (alertante || 'Alertante'),
          municipio,
          poblacion,
          direccion,
          notas: modoInterrogatorioReal
            ? '[LLAMADA EN CURSO — REALIZAR INTERROGATORIO TELEFÓNICO AL ALERTANTE]'
            : notas,
          nombrePac: modoInterrogatorioReal ? '' : nombrePac,
          edad: modoInterrogatorioReal ? '' : edad,
          sexo: modoInterrogatorioReal ? 'H' : sexo,
          lat: coords.lat,
          lng: coords.lng,
          precision: coords.precision
        });
        setLlamadaActivaId(inc.id);
      };

      const enviarMensajeEnLlamada = async (nuevoMsg) => {
        if (!llamadaActual) return;
        await actualizarIncidente(llamadaActual.id, {
          mensajesLlamada: [...(llamadaActual.mensajesLlamada || []), nuevoMsg]
        });
      };

      return (
        <div className="flex-1 max-w-6xl w-full mx-auto p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
            <div className="bg-gradient-to-r from-red-700 to-red-900 px-5 py-3.5 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center text-xl">
                  <i className="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div>
                  <h2 className="font-bold text-lg text-white">Terminal Móvil Alertante (AML + Voz Real)</h2>
                  <p className="text-xs text-red-100">Simula una llamada real desde la calle al 112 / 061 con envío automático de GPS</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-[11px] font-bold text-red-200 mr-1">Cargar caso práctico:</span>
                {CASOS_PRACTICOS_ALERTANTE.map((c, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => cargarCaso(c)}
                    className="bg-black/35 hover:bg-black/60 text-white text-xs px-2.5 py-1 rounded border border-white/25 transition font-semibold"
                  >
                    <i className="fa-solid fa-file-medical mr-1 text-amber-300"></i>
                    {c.titulo}
                  </button>
                ))}
              </div>
            </div>

            {llamadaActual ? (
              <div className="p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-slate-950 border-2 border-slate-700 rounded-2xl p-5 text-center space-y-3 shadow-xl">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-red-950 border border-red-600 text-red-300">
                      <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                      LLAMADA EMERGENCIA {llamadaActual.linea} · {formatTimer(segundosLlamada)}
                    </div>

                    <div>
                      <div className="text-2xl font-black text-white tracking-wider">{llamadaActual.linea}</div>
                      <div className="text-xs font-mono text-amber-400 mt-0.5">Ficha: {llamadaActual.numFicha}</div>
                    </div>

                    <div className="bg-slate-900 rounded-lg p-2.5 text-xs text-slate-200 border border-slate-800">
                      {llamadaActual.estado === 'LLAMADA_ENTRANTE' && (
                        <span className="text-amber-300 font-bold animate-pulse">
                          <i className="fa-solid fa-phone-volume mr-1.5"></i>
                          Llamando... Esperando que descuelgue el Gestor de Demanda
                        </span>
                      )}
                      {llamadaActual.estado === 'EN_ATENCION' && (
                        <span className="text-emerald-400 font-bold">
                          <i className="fa-solid fa-headset mr-1.5"></i>
                          En línea con {llamadaActual.operadorDemanda}
                        </span>
                      )}
                      {llamadaActual.estado === 'TRASPASADO' && (
                        <span className="text-cyan-400 font-bold">
                          Ficha clasificada y traspasada a Coordinación 061
                        </span>
                      )}
                      {llamadaActual.estado === 'ASIGNADO' && (
                        <span className="text-emerald-400 font-bold">
                          🚑 ¡Ambulancia movilizada hacia tu ubicación!
                        </span>
                      )}
                      {llamadaActual.estado === 'FINALIZADO' && 'Llamada y servicio finalizados'}
                    </div>

                    <div className="text-[11px] text-cyan-400 font-mono">
                      AML GPS activo: {llamadaActual.lat}, {llamadaActual.lng} (±{llamadaActual.precision}m)
                    </div>

                    <button
                      onClick={() => setLlamadaActivaId(null)}
                      className="w-full bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-black uppercase tracking-wider shadow-lg"
                    >
                      <i className="fa-solid fa-phone-slash mr-1.5"></i>
                      Colgar Llamada
                    </button>
                  </div>

                  {(guionActivo.length > 0 || notas) && (
                    <div className="bg-amber-950/50 border border-amber-600/70 rounded-xl p-3.5 text-xs space-y-2">
                      <div className="font-bold text-amber-300 uppercase flex items-center gap-1.5">
                        <i className="fa-solid fa-masks-theater"></i>

                      </div>
                      {guionActivo.length > 0 ? (
                        <ul className="space-y-1 text-slate-200 list-disc pl-4">
                          {guionActivo.map((lineaGuion, i) => (
                            <li key={i}>{lineaGuion}</li>
                          ))}
                        </ul>
                      ) : (
                        <p className="text-slate-200">{notas}</p>
                      )}
                      {nombrePac && (
                        <div className="pt-1 border-t border-amber-800/50 text-[11px] text-amber-200">
                          <strong>Datos paciente (si te preguntan):</strong> {nombrePac}, {edad} años, sexo {sexo}.
                        </div>
                      )}
                    </div>
                  )}

                  {llamadaActual.consejoAlertante && (
                    <div className="bg-emerald-950/90 border-2 border-emerald-500 rounded-xl p-3.5">
                      <div className="text-xs font-black text-emerald-400 uppercase mb-1">
                        <i className="fa-solid fa-kit-medical mr-1.5"></i>
                        Instrucción Pre-Arribo del Operador 112:
                      </div>
                      <p className="text-sm text-white font-semibold">{llamadaActual.consejoAlertante}</p>
                    </div>
                  )}
                </div>

                <div className="lg:col-span-7 space-y-4">
                  <LineaTelefonicaVoz
                    incidente={llamadaActual}
                    rolEnLlamada="ALERTANTE"
                    nombreEmisor={`Alertante (${llamadaActual.telefono})`}
                    enviarAudioOTextoLlamada={enviarMensajeEnLlamada}
                  />

                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-300">Mapa de seguimiento de recursos asignados:</span>
                      {llamadaActual.recursosAsignados?.length > 0 && (
                        <span className="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold">
                          En camino: {llamadaActual.recursosAsignados.join(', ')}
                        </span>
                      )}
                    </div>
                    <MapaGIS
                      incidente={llamadaActual}
                      unidades={unidades.filter(u => (llamadaActual.recursosAsignados || []).includes(u.id))}
                      altura="h-48"
                    />
                  </div>
                </div>
              </div>
            ) : (
              <form onSubmit={realizarLlamada} className="p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-3 bg-slate-950 border-2 border-slate-700 rounded-2xl p-3.5 flex flex-col justify-between space-y-3">
                  <div className="text-center">
                    <div className="text-[10px] font-bold text-slate-400 uppercase">Marcador Emergencias</div>
                    <div className="bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 mt-1 font-mono text-2xl font-black text-white tracking-widest">
                      {linea || '112'}
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-1.5">
                    {['1','2','3','4','5','6','7','8','9','*','0','#'].map(d => (
                      <button
                        key={d}
                        type="button"
                        onClick={() => marcarDigito(d)}
                        className="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-white font-bold py-2.5 rounded-lg text-sm border border-slate-700"
                      >
                        {d}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 gap-1.5">
                    <button
                      type="button"
                      onClick={() => { playDTMF('1'); setLinea('112'); }}
                      className={`py-1.5 rounded font-black text-xs border ${
                        linea === '112' ? 'bg-red-600 border-red-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-300'
                      }`}
                    >
                      112 CAT
                    </button>
                    <button
                      type="button"
                      onClick={() => { playDTMF('0'); setLinea('061'); }}
                      className={`py-1.5 rounded font-black text-xs border ${
                        linea === '061' ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-300'
                      }`}
                    >
                      061 SEM
                    </button>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tu Nº Teléfono (CLI)</label>
                    <input
                      type="text"
                      value={telefono}
                      onChange={e => setTelefono(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-amber-300 font-mono font-bold text-center"
                      required
                    />
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-3">
                  <div className="bg-blue-950/60 border border-blue-600/70 rounded-lg p-2.5 flex items-center justify-between gap-2">
                    <div>
                      <div className="text-xs font-bold text-blue-300">Modo Interrogatorio Realista</div>
                      <div className="text-[11px] text-slate-300">
                        {modoInterrogatorioReal
                          ? 'El operador solo recibe tu teléfono y GPS; debes contarle el caso por voz.'
                          : 'El operador recibe el texto escrito al instante al descolgar.'}
                      </div>
                    </div>
                    <input
                      type="checkbox"
                      checked={modoInterrogatorioReal}
                      onChange={e => setModoInterrogatorioReal(e.target.checked)}
                      className="w-4 h-4 accent-blue-500 cursor-pointer"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Municipio *</label>
                      <input
                        type="text"
                        value={municipio}
                        onChange={e => setMunicipio(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Alertante / Relación</label>
                      <input
                        type="text"
                        placeholder="Ej. Ana López (Hija)"
                        value={alertante}
                        onChange={e => setAlertante(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Dirección Exacta / Punto Km *</label>
                    <div className="flex gap-1.5">
                      <input
                        type="text"
                        placeholder="Calle, número, piso o haz clic en el mapa..."
                        value={direccion}
                        onChange={e => setDireccion(e.target.value)}
                        className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white"
                        required
                      />
                      <button
                        type="button"
                        onClick={buscarDireccionEnMapa}
                        disabled={buscandoDir}
                        className="bg-slate-700 hover:bg-slate-600 text-white px-3 rounded text-xs font-bold"
                        title="Situar dirección escrita en el mapa"
                      >
                        <i className="fa-solid fa-magnifying-glass-location"></i>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">
                      Guion / Descripción de lo que ocurre {modoInterrogatorioReal ? '(Para tu roleplay)' : '*'}
                    </label>
                    <textarea
                      rows="3"
                      placeholder="Explica qué ha pasado, consciencia, respiración, síntomas..."
                      value={notas}
                      onChange={e => setNotas(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white"
                      required={!modoInterrogatorioReal}
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-3 gap-2 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Paciente</label>
                      <input
                        type="text"
                        value={nombrePac}
                        onChange={e => setNombrePac(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Edad</label>
                      <input
                        type="text"
                        value={edad}
                        onChange={e => setEdad(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Sexo</label>
                      <select
                        value={sexo}
                        onChange={e => setSexo(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                      >
                        <option value="H">H</option>
                        <option value="M">M</option>
                        <option value="D">Desc.</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-4 flex flex-col justify-between bg-slate-950/80 border border-slate-800 rounded-xl p-3 space-y-2.5">
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-cyan-400 uppercase">
                        <i className="fa-solid fa-location-crosshairs mr-1"></i>
                        Geolocalización AML
                      </span>
                      <button
                        type="button"
                        onClick={obtenerGPSReal}
                        className="bg-cyan-700 hover:bg-cyan-600 text-white text-[11px] font-bold px-2.5 py-1 rounded"
                      >
                        Usar mi GPS Real
                      </button>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Haz clic en el mapa para detectar automáticamente la calle y coordenadas AML:
                    </p>

                    <MapaGIS
                      coordenadasSeleccionadas={coords}
                      onSeleccionarPunto={(pt) => resolverDireccionDesdeCoords(pt.lat, pt.lng, pt.precision)}
                      altura="h-52"
                    />

                    <div className="bg-slate-900 border border-slate-800 rounded p-2 font-mono text-[11px] text-emerald-400 flex justify-between">
                      <span>LAT: {coords.lat} | LNG: {coords.lng}</span>
                      <span>±{coords.precision}m</span>
                    </div>
                    <div className="text-[11px] text-slate-300 truncate" title={gpsStatus}>{gpsStatus}</div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3.5 rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center gap-2 text-sm transition"
                  >
                    <i className="fa-solid fa-phone-volume"></i>
                    LLAMAR AL {linea || '112'} Y ENVIAR AML
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. PANTALLA DE LOGIN DE SALA CECOS / TERMINAL EMBARCADO
    // =========================================================================
    function LoginCECOS({ onLogin }) {
      const [userInput, setUserInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const encontrado = USUARIOS_AULA.find(
          u => u.user.toLowerCase() === userInput.trim().toLowerCase() && u.pass === passInput.trim()
        );
        if (!encontrado) {
          setError('Usuario o contraseña incorrectos.');
          return;
        }
        onLogin(encontrado);
      };

      const autocompletar = (u, p) => {
        setUserInput(u);
        setPassInput(p);
        setError('');
      };

      return (
        <div className="flex-1 flex items-center justify-center p-4">
          <div className="max-w-3xl w-full grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
            <div className="flex flex-col justify-between">
              <div>
                <div className="inline-block bg-blue-600/20 text-blue-400 border border-blue-500/40 text-xs font-bold px-2.5 py-1 rounded mb-3">
                  ACCESO OPERADORES CECOS & TERMINALES EMBARCADOS
                </div>
                <h2 className="text-2xl font-bold text-white mb-2">Identificación de Puesto</h2>
                <p className="text-sm text-slate-400 mb-5">
                  Introduce las credenciales asignadas para entrar en tu consola de sala o en la tablet embarcada de ambulancia.
                </p>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Usuario</label>
                    <input
                      type="text"
                      value={userInput}
                      onChange={e => { setUserInput(e.target.value); setError(''); }}
                      placeholder="Ej. demanda1, respuesta1, unidad1..."
                      className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-white"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Contraseña</label>
                    <input
                      type="password"
                      value={passInput}
                      onChange={e => { setPassInput(e.target.value); setError(''); }}
                      placeholder="••••"
                      className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-white"
                      required
                    />
                  </div>
                  {error && <p className="text-xs text-red-400 font-semibold">{error}</p>}
                  <button
                    type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition"
                  >
                    Iniciar Turno
                  </button>
                </form>
              </div>
            </div>

            <div className="bg-slate-950 border border-slate-800 rounded-lg p-4 text-xs space-y-2.5">
              <h3 className="font-bold text-slate-200 uppercase tracking-wider border-b border-slate-800 pb-1.5">
                Credenciales de Puestos (Clic para rellenar)
              </h3>
              <div className="space-y-1.5 text-slate-300">
                <div onClick={() => autocompletar('demanda1', '112')} className="cursor-pointer hover:bg-slate-800 p-2 rounded bg-slate-900 flex justify-between items-center">
                  <span><strong className="text-amber-400">Gestor Demanda:</strong> demanda1 / demanda2 / demanda3</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">112</span>
                </div>
                <div onClick={() => autocompletar('respuesta1', '061')} className="cursor-pointer hover:bg-slate-800 p-2 rounded bg-slate-900 flex justify-between items-center">
                  <span><strong className="text-emerald-400">Gestor Respuesta:</strong> respuesta1 / respuesta2</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">061</span>
                </div>

                  <span><strong className="text-yellow-400">Terminal Embarcado SEM:</strong> unidad1 (YI12) ... unidad5</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">sem</span>

                </div>

      );

              <button

              {tabActiva === 'RESPUESTA' && (
                <ConsolaGestorRespuesta
