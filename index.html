    // =========================================================================
    // SONIDOS SINTETIZADOS (RING LLAMADA & TONOS TELEFÓNICOS / TETRA)
    // =========================================================================
    const playTone = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'ptt_in') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1100, ctx.currentTime);
          osc.frequency.setValueAtTime(1450, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'ptt_out') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(950, ctx.currentTime);
          osc.frequency.setValueAtTime(680, ctx.currentTime + 0.07);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
          osc.start();
          osc.stop(ctx.currentTime + 0.17);
        } else if (type === 'ring') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(425, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.46);
        }
      } catch (e) {}
    };

    // =========================================================================
    // COMPONENTE REUTILIZABLE: VISOR MAPA GIS TÁCTICO (LEAFLET)
    // =========================================================================
    function MapaGIS({
      incidente,
      unidades = [],
      coordenadasSeleccionadas,
      onSeleccionarPunto,
      altura = 'h-64'
    }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const layerGroupRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current || !window.L) return;
        const initLat = incidente?.lat || coordenadasSeleccionadas?.lat || 41.3874;
        const initLng = incidente?.lng || coordenadasSeleccionadas?.lng || 2.1686;

        const map = window.L.map(mapContainerRef.current).setView([initLat, initLng], 14);
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap | GIS CAT112'
        }).addTo(map);

        const group = window.L.layerGroup().addTo(map);
        mapInstanceRef.current = map;
        layerGroupRef.current = group;

        if (onSeleccionarPunto) {
          map.on('click', (e) => {
            onSeleccionarPunto({
              lat: Number(e.latlng.lat.toFixed(6)),
              lng: Number(e.latlng.lng.toFixed(6)),
              precision: 10
            });
          });
        }

        setTimeout(() => map.invalidateSize(), 250);

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      useEffect(() => {
        const map = mapInstanceRef.current;
        const group = layerGroupRef.current;
        if (!map || !group || !window.L) return;

        group.clearLayers();

        const targetLat = incidente?.lat || coordenadasSeleccionadas?.lat;
        const targetLng = incidente?.lng || coordenadasSeleccionadas?.lng;
        const precision = incidente?.precision || coordenadasSeleccionadas?.precision || 15;

        if (targetLat && targetLng) {
          // Círculo de precisión AML (Advanced Mobile Location)
          window.L.circle([targetLat, targetLng], {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.18,
            radius: precision
          }).addTo(group);

          // Marcador rojo de emergencia
          const incIcon = window.L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background:#dc2626;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 0 10px rgba(220,38,38,0.9);font-weight:bold;font-size:12px;">112</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          window.L.marker([targetLat, targetLng], { icon: incIcon })
            .bindPopup(`<strong>${incidente?.numFicha || 'Ubicación Alertante'}</strong><br/>${incidente?.direccion || 'Punto AML'}<br/>Precisión AML: ±${precision}m`)
            .addTo(group);

          map.setView([targetLat, targetLng], 15);
        }

        // Dibujar unidades móviles SEM
        unidades.forEach(u => {
          if (!u.lat || !u.lng) return;
          const color = u.estado === 'DISPONIBLE' ? '#059669' : '#d97706';
          const uIcon = window.L.divIcon({
            className: 'custom-unit-icon',
            html: `<div style="background:${color};color:white;padding:2px 6px;border-radius:6px;border:2px solid white;font-size:10px;font-weight:900;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.6);">🚑 ${u.id}</div>`,
            iconSize: [54, 22],
            iconAnchor: [27, 11]
          });
          window.L.marker([u.lat, u.lng], { icon: uIcon })
            .bindPopup(`<strong>${u.id} (${u.tipo})</strong><br/>Estado: ${u.estado}<br/>${u.base}`)
            .addTo(group);
        });
      }, [incidente, unidades, coordenadasSeleccionadas]);

      return (
        <div className={`w-full ${altura} rounded-lg overflow-hidden border border-slate-600 relative`}>
          <div ref={mapContainerRef} className="w-full h-full"></div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE DE VOZ TELEFÓNICA BIDIRECCIONAL (ALERTANTE <-> OPERADOR 112)
    // =========================================================================
    function LineaTelefonicaVoz({
      incidente,
      rolEnLlamada, // 'ALERTANTE' | 'OPERADOR'
      nombreEmisor,
      enviarAudioOTextoLlamada
    }) {
      const [grabando, setGrabando] = useState(false);
      const [textoMsg, setTextoMsg] = useState('');
      const [autoPlay, setAutoPlay] = useState(true);
      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);
      const lastPlayedIdRef = useRef(null);
      const endRef = useRef(null);

      const mensajes = incidente?.mensajesLlamada || [];

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (!autoPlay || mensajes.length === 0) return;
        const ultimo = mensajes[mensajes.length - 1];
        if (ultimo.id !== lastPlayedIdRef.current && ultimo.rol !== rolEnLlamada && ultimo.audioBase64) {
          lastPlayedIdRef.current = ultimo.id;
          try {
            const audio = new Audio(ultimo.audioBase64);
            audio.play().catch(() => {});
          } catch (e) {}
        }
      }, [mensajes.length]);

      const iniciarVoz = async () => {
        playTone('ptt_in');
        setGrabando(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mr = new MediaRecorder(stream);
          chunksRef.current = [];
          mr.ondataavailable = (e) => {
            if (e.data.size > 0) chunksRef.current.push(e.data);
          };
          mr.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = async () => {
              await enviarAudioOTextoLlamada({
                id: 'tel_' + Date.now(),
                rol: rolEnLlamada,
                emisor: nombreEmisor,
                hora: new Date().toLocaleTimeString('es-ES'),
                texto: '📞 Voz en línea telefónica',
                audioBase64: reader.result
              });
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorderRef.current = mr;
          mr.start();
        } catch (err) {
          alert('No se detectó micrófono o no diste permiso en el navegador. Puedes escribir en el chat telefónico inferior.');
          setGrabando(false);
        }
      };

      const detenerVoz = () => {
        if (!grabando) return;
        playTone('ptt_out');
        setGrabando(false);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
      };

      const enviarTexto = async (e) => {
        e.preventDefault();
        if (!textoMsg.trim()) return;
        await enviarAudioOTextoLlamada({
          id: 'tel_' + Date.now(),
          rol: rolEnLlamada,
          emisor: nombreEmisor,
          hora: new Date().toLocaleTimeString('es-ES'),
          texto: textoMsg.trim()
        });
        setTextoMsg('');
      };

      return (
        <div className="bg-slate-900 border-2 border-blue-500/70 rounded-xl p-3 space-y-2.5 text-slate-100">
          <div className="flex items-center justify-between border-b border-slate-700 pb-1.5">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-green-400 animate-ping"></span>
              <span className="text-xs font-black text-blue-300 uppercase">
                Línea Telefónica Activa ({incidente.numFicha})
              </span>
            </div>
            <label className="flex items-center gap-1 text-[11px] text-slate-300 cursor-pointer">
              <input
                type="checkbox"
                checked={autoPlay}
                onChange={e => setAutoPlay(e.target.checked)}
              />
              Auto-escuchar voz
            </label>
          </div>

          <div className="bg-slate-950 rounded-lg p-2 max-h-40 overflow-y-auto space-y-1.5 text-xs">
            {mensajes.length === 0 ? (
              <div className="text-slate-500 text-center py-3">
                Canal de voz abierto entre Alertante y Operador 112. Mantén pulsado el botón azul para hablar.
              </div>
            ) : (
              mensajes.map(m => (
                <div
                  key={m.id}
                  className={`p-2 rounded-lg ${
                    m.rol === rolEnLlamada
                      ? 'bg-blue-950/80 border border-blue-700 ml-6'
                      : 'bg-slate-800 border border-slate-700 mr-6'
                  }`}
                >
                  <div className="flex justify-between text-[10px] text-slate-400 font-bold">
                    <span>{m.emisor}</span>
                    <span>{m.hora}</span>
                  </div>
                  <div className="text-white mt-0.5">{m.texto}</div>
                  {m.audioBase64 && (
                    <audio controls src={m.audioBase64} className="w-full h-7 mt-1" />
                  )}
                </div>
              ))
            )}
            <div ref={endRef} />
          </div>

          <button
            type="button"
            onMouseDown={iniciarVoz}
            onMouseUp={detenerVoz}
            onMouseLeave={detenerVoz}
            onTouchStart={iniciarVoz}
            onTouchEnd={detenerVoz}
            className={`w-full py-2.5 rounded-lg font-black text-xs uppercase flex items-center justify-center gap-2 transition ${
              grabando
                ? 'bg-red-600 text-white animate-pulse ring-4 ring-red-500/40'
                : 'bg-blue-600 hover:bg-blue-500 text-white'
            }`}
          >
            <i className="fa-solid fa-microphone"></i>
            {grabando ? 'HABLANDO POR TELÉFONO... SUELTA PARA ENVIAR' : 'MANTENER PULSADO PARA HABLAR POR TELÉFONO'}
          </button>

          <form onSubmit={enviarTexto} className="flex gap-1.5">
            <input
              type="text"
              placeholder="Escribe si no tienes micrófono..."
              value={textoMsg}
              onChange={e => setTextoMsg(e.target.value)}
              className="flex-1 bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white"
            />
            <button
              type="submit"
              className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-xs font-bold"
            >
              Enviar
            </button>
          </form>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE PRINCIPAL
    // =========================================================================
    function App() {
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const cfgParam = urlParams.get('cfg');
          if (cfgParam) {
            const decoded = JSON.parse(atob(cfgParam));
            localStorage.setItem('cecos_fb_config', JSON.stringify(decoded));
            return decoded;
          }
          const saved = localStorage.getItem('cecos_fb_config');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [sdkReady, setSdkReady] = useState(!!window.FirebaseSDK);
      const [dbInstance, setDbInstance] = useState(null);
      const [netStatus, setNetStatus] = useState('LOCAL');
      const [showConfigModal, setShowConfigModal] = useState(false);

      const [vistaPrincipal, setVistaPrincipal] = useState('CECOS');
      const [usuarioActual, setUsuarioActual] = useState(null);

      const [incidentes, setIncidentes] = useState([]);
      const [unidades, setUnidades] = useState(UNIDADES_INICIALES);
      const [mensajesRadio, setMensajesRadio] = useState([]);

      useEffect(() => {
        if (window.FirebaseSDK) {
          setSdkReady(true);
          return;
        }
        const onReady = () => setSdkReady(true);
        window.addEventListener('firebase-sdk-ready', onReady);
        return () => window.removeEventListener('firebase-sdk-ready', onReady);
      }, []);

      useEffect(() => {
        if (!firebaseConfig) {
          setNetStatus('LOCAL');
          cargarDatosLocales();
          return;
        }
        if (!sdkReady) {
          setNetStatus('CONNECTING');
          return;
        }

        let unsubInc = null;
        let unsubUni = null;
        let unsubRad = null;

        const initCloud = async () => {
          setNetStatus('CONNECTING');
          try {
            const {
              initializeApp, getApps, getAuth, signInAnonymously,
              getFirestore, collection, onSnapshot, query, orderBy, doc, setDoc, getDocs
            } = window.FirebaseSDK;

            const app = getApps().length > 0 ? getApps()[0] : initializeApp(firebaseConfig);
            const auth = getAuth(app);
            await signInAnonymously(auth);
            const db = getFirestore(app);
            setDbInstance(db);
            setNetStatus('CLOUD');

            const uniSnap = await getDocs(collection(db, 'cecos_unidades'));
            if (uniSnap.empty) {
              for (const u of UNIDADES_INICIALES) {
                await setDoc(doc(db, 'cecos_unidades', u.id), u);
              }
            }

            unsubInc = onSnapshot(query(collection(db, 'cecos_incidentes'), orderBy('timestamp', 'desc')), (snap) => {
              setIncidentes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });

            unsubUni = onSnapshot(collection(db, 'cecos_unidades'), (snap) => {
              if (!snap.empty) {
                setUnidades(snap.docs.map(d => ({ id: d.id, ...d.data() })));
              }
            });

            unsubRad = onSnapshot(query(collection(db, 'cecos_radio'), orderBy('timestamp', 'asc')), (snap) => {
              setMensajesRadio(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
          } catch (err) {
            console.error('Error conectando Firebase:', err);
            setNetStatus('LOCAL');
            cargarDatosLocales();
          }
        };

        initCloud();
        return () => {
          if (unsubInc) unsubInc();
          if (unsubUni) unsubUni();
          if (unsubRad) unsubRad();
        };
      }, [firebaseConfig, sdkReady]);

      const cargarDatosLocales = () => {
        try {
          const inc = JSON.parse(localStorage.getItem('cecos_local_inc') || '[]');
          const uni = JSON.parse(localStorage.getItem('cecos_local_uni') || 'null');
          const rad = JSON.parse(localStorage.getItem('cecos_local_rad') || '[]');
          setIncidentes(inc);
          setUnidades(uni || UNIDADES_INICIALES);
          setMensajesRadio(rad);
        } catch (e) {}
      };

      useEffect(() => {
        if (netStatus !== 'LOCAL') return;
        const onStorage = (e) => {
          if (e.key && e.key.startsWith('cecos_local_')) cargarDatosLocales();
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, [netStatus]);

      const crearIncidente = async (nuevoInc) => {
        const numFicha = 'CAT-' + Math.floor(100000 + Math.random() * 900000);
        const now = new Date();
        const payload = {
          ...nuevoInc,
          numFicha,
          fecha: now.toLocaleDateString('es-ES'),
          horaLlamada: now.toLocaleTimeString('es-ES'),
          horaTraspaso: '',
          estado: 'LLAMADA_ENTRANTE',
          operadorDemanda: '',
          gestorRespuesta: '',
          tipoDemanda: '',
          interrogatorio: '',
          clasificacion: '',
          consejoAlertante: '',
          recursosAsignados: [],
          mensajesLlamada: [],
          cronologia: [
            {
              hora: now.toLocaleTimeString('es-ES'),
              texto: `Llamada entrante en ${nuevoInc.linea || '112'} desde ${nuevoInc.telefono} | AML GPS: ${nuevoInc.lat}, ${nuevoInc.lng} (±${nuevoInc.precision}m)`
            }
          ],
          timestamp: Date.now()
        };

        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, addDoc } = window.FirebaseSDK;
          const ref = await addDoc(collection(dbInstance, 'cecos_incidentes'), payload);
          return { id: ref.id, ...payload };
        } else {
          const item = { id: 'loc_' + Date.now(), ...payload };
          const lista = [item, ...incidentes];
          setIncidentes(lista);
          localStorage.setItem('cecos_local_inc', JSON.stringify(lista));
          return item;
        }
      };

      const actualizarIncidente = async (id, cambios) => {
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, updateDoc } = window.FirebaseSDK;
          await updateDoc(doc(dbInstance, 'cecos_incidentes', id), cambios);
        } else {
          const lista = incidentes.map(inc => inc.id === id ? { ...inc, ...cambios } : inc);
          setIncidentes(lista);
          localStorage.setItem('cecos_local_inc', JSON.stringify(lista));
        }
      };

      const actualizarUnidad = async (unidadId, cambios) => {
        if (netStatus === 'CLOUD' && dbInstance) {
          const { doc, updateDoc } = window.FirebaseSDK;
          await updateDoc(doc(dbInstance, 'cecos_unidades', unidadId), cambios);
        } else {
          const lista = unidades.map(u => u.id === unidadId ? { ...u, ...cambios } : u);
          setUnidades(lista);
          localStorage.setItem('cecos_local_uni', JSON.stringify(lista));
        }
      };

      const enviarMensajeRadio = async (msg) => {
        const payload = {
          ...msg,
          hora: new Date().toLocaleTimeString('es-ES'),
          timestamp: Date.now()
        };
        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, addDoc } = window.FirebaseSDK;
          await addDoc(collection(dbInstance, 'cecos_radio'), payload);
        } else {
          const lista = [...mensajesRadio, { id: 'rad_' + Date.now(), ...payload }];
          setMensajesRadio(lista);
          localStorage.setItem('cecos_local_rad', JSON.stringify(lista));
        }
      };

      const reiniciarSimulacion = async () => {
        if (!confirm('¿Seguro que deseas borrar todos los incidentes, mensajes de radio y devolver las ambulancias a sus bases?')) return;
        if (netStatus === 'CLOUD' && dbInstance) {
          const { collection, getDocs, deleteDoc, doc, setDoc } = window.FirebaseSDK;
          const incSnap = await getDocs(collection(dbInstance, 'cecos_incidentes'));
          for (const d of incSnap.docs) await deleteDoc(doc(dbInstance, 'cecos_incidentes', d.id));
          const radSnap = await getDocs(collection(dbInstance, 'cecos_radio'));
          for (const d of radSnap.docs) await deleteDoc(doc(dbInstance, 'cecos_radio', d.id));
          for (const u of UNIDADES_INICIALES) await setDoc(doc(dbInstance, 'cecos_unidades', u.id), u);
        } else {
          localStorage.removeItem('cecos_local_inc');
          localStorage.removeItem('cecos_local_rad');
          localStorage.setItem('cecos_local_uni', JSON.stringify(UNIDADES_INICIALES));
          setIncidentes([]);
          setMensajesRadio([]);
          setUnidades(UNIDADES_INICIALES);
        }
      };

      const llamadasEntrantes = incidentes.filter(i => i.estado === 'LLAMADA_ENTRANTE').length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
          {/* BARRA SUPERIOR GLOBAL */}
          <header className="bg-slate-950 border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="bg-red-600 text-white font-black px-2.5 py-1 rounded text-sm tracking-wider shadow">
                CAT112 / 061
              </div>
              <div>
                <h1 className="font-bold text-sm md:text-base text-white leading-tight">
                  SIMULADOR CECOS — TELEEMERGENCIAS GIS & VOZ
                </h1>
                <p className="text-xs text-slate-400">CFGM Emergencias Sanitarias · Geolocalización AML + Línea Voz + TETRA</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setVistaPrincipal('ALERTANTE')}
                className={`px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 transition ${
                  vistaPrincipal === 'ALERTANTE'
                    ? 'bg-red-600 text-white shadow-lg shadow-red-600/30'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                <i className="fa-solid fa-phone-volume"></i>
                Teléfono Alertante (112/061)
              </button>

              <button
                onClick={() => setVistaPrincipal('CECOS')}
                className={`px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 transition relative ${
                  vistaPrincipal === 'CECOS'
                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                <i className="fa-solid fa-headset"></i>
                Consola Sala CECOS
                {llamadasEntrantes > 0 && (
                  <span className="ml-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full animate-bounce">
                    {llamadasEntrantes}
                  </span>
                )}
              </button>

              <button
                onClick={() => setShowConfigModal(true)}
                className={`px-2.5 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5 border ${
                  netStatus === 'CLOUD'
                    ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300'
                    : netStatus === 'CONNECTING'
                    ? 'bg-blue-950/80 border-blue-500 text-blue-300'
                    : 'bg-amber-950/80 border-amber-600 text-amber-300'
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${
                  netStatus === 'CLOUD' ? 'bg-emerald-400 animate-pulse' :
                  netStatus === 'CONNECTING' ? 'bg-blue-400 animate-ping' : 'bg-amber-400'
                }`}></span>
                {netStatus === 'CLOUD' ? 'Red Aula Activa' : netStatus === 'CONNECTING' ? 'Conectando...' : 'Modo Local (1 PC)'}
              </button>
            </div>
          </header>

          <main className="flex-1 flex flex-col">
            {vistaPrincipal === 'ALERTANTE' ? (
              <PortalAlertante
                crearIncidente={crearIncidente}
                actualizarIncidente={actualizarIncidente}
                incidentes={incidentes}
                unidades={unidades}
              />
            ) : !usuarioActual ? (
              <LoginCECOS onLogin={(u) => setUsuarioActual(u)} />
            ) : (
              <SalaCECOS
                usuario={usuarioActual}
                onLogout={() => setUsuarioActual(null)}
                incidentes={incidentes}
                unidades={unidades}
                mensajesRadio={mensajesRadio}
                actualizarIncidente={actualizarIncidente}
                actualizarUnidad={actualizarUnidad}
                enviarMensajeRadio={enviarMensajeRadio}
                reiniciarSimulacion={reiniciarSimulacion}
              />
            )}
          </main>

          {showConfigModal && (
            <ModalConfigRed
              firebaseConfig={firebaseConfig}
              onSave={(cfg) => {
                if (cfg) {
                  localStorage.setItem('cecos_fb_config', JSON.stringify(cfg));
                } else {
                  localStorage.removeItem('cecos_fb_config');
                }
                setFirebaseConfig(cfg);
                setShowConfigModal(false);
              }}
              onClose={() => setShowConfigModal(false)}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // 1. PORTAL DEL ALERTANTE (CON GEOLOCALIZACIÓN AML Y VOZ TELEFÓNICA)
    // =========================================================================
    function PortalAlertante({ crearIncidente, actualizarIncidente, incidentes, unidades }) {
      const [linea, setLinea] = useState('112');
      const [telefono, setTelefono] = useState('6' + Math.floor(10000000 + Math.random() * 89999999));
      const [alertante, setAlertante] = useState('');
      const [municipio, setMunicipio] = useState('Barcelona');
      const [poblacion, setPoblacion] = useState('');
      const [direccion, setDireccion] = useState('');
      const [notas, setNotas] = useState('');
      const [nombrePac, setNombrePac] = useState('');
      const [edad, setEdad] = useState('');
      const [sexo, setSexo] = useState('H');
      const [coords, setCoords] = useState({ lat: 41.3874, lng: 2.1686, precision: 20 });
      const [gpsStatus, setGpsStatus] = useState('Listo (Haz clic en el mapa o usa GPS real)');
      const [llamadaActivaId, setLlamadaActivaId] = useState(null);

      const llamadaActual = useMemo(
        () => incidentes.find(i => i.id === llamadaActivaId),
        [incidentes, llamadaActivaId]
      );

      const obtenerGPSReal = () => {
        if (!navigator.geolocation) {
          setGpsStatus('Tu navegador no soporta GPS.');
          return;
        }
        setGpsStatus('Obteniendo satélite GPS AML...');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setCoords({
              lat: Number(pos.coords.latitude.toFixed(6)),
              lng: Number(pos.coords.longitude.toFixed(6)),
              precision: Math.round(pos.coords.accuracy || 15)
            });
            setGpsStatus(`GPS AML fijado (±${Math.round(pos.coords.accuracy || 15)}m)`);
          },
          () => {
            setGpsStatus('Permiso denegado. Haz clic en el mapa para fijar punto.');
          },
          { enableHighAccuracy: true }
        );
      };

      const cargarCaso = (caso) => {
        setTelefono(caso.telefono);
        setAlertante(caso.alertante);
        setMunicipio(caso.municipio);
        setPoblacion(caso.poblacion);
        setDireccion(caso.direccion);
        setNotas(caso.notas);
        setNombrePac(caso.nombrePac);
        setEdad(caso.edad);
        setSexo(caso.sexo);
        setCoords({ lat: caso.lat, lng: caso.lng, precision: caso.precision });
        setGpsStatus(`Coordenadas AML cargadas (±${caso.precision}m)`);
      };

      const realizarLlamada = async (e) => {
        e.preventDefault();
        if (!direccion.trim() || !notas.trim()) {
          alert('Por favor indica al menos la dirección y qué está ocurriendo.');
          return;
        }
        playTone('ring');
        const inc = await crearIncidente({
          linea,
          telefono,
          alertante: alertante || 'Alertante anónimo',
          municipio,
          poblacion,
          direccion,
          notas,
          nombrePac,
          edad,
          sexo,
          lat: coords.lat,
          lng: coords.lng,
          precision: coords.precision
        });
        setLlamadaActivaId(inc.id);
      };

      const enviarMensajeEnLlamada = async (nuevoMsg) => {
        if (!llamadaActual) return;
        await actualizarIncidente(llamadaActual.id, {
          mensajesLlamada: [...(llamadaActual.mensajesLlamada || []), nuevoMsg]
        });
      };

      return (
        <div className="flex-1 max-w-5xl w-full mx-auto p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
            <div className="bg-gradient-to-r from-red-700 to-red-900 px-5 py-3.5 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center text-xl">
                  <i className="fa-solid fa-phone-flip"></i>
                </div>
                <div>
                  <h2 className="font-bold text-lg text-white">Terminal de Llamada de Emergencia (AML + Voz)</h2>
                  <p className="text-xs text-red-100">Envía ubicación GPS AML automática y habla en directo con el Operador 112</p>
                </div>
              </div>

              <div className="flex flex-wrap gap-1.5">
                {CASOS_PRACTICOS_ALERTANTE.map((c, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => cargarCaso(c)}
                    className="bg-black/30 hover:bg-black/50 text-white text-xs px-2.5 py-1 rounded border border-white/20 transition"
                  >
                    <i className="fa-solid fa-wand-magic-sparkles mr-1"></i>
                    {c.titulo.split(':')[0]}
                  </button>
                ))}
              </div>
            </div>

            {llamadaActual ? (
              <div className="p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-6 space-y-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 text-center space-y-2">
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-amber-300">
                      FICHA {llamadaActual.numFicha} · LÍNEA {llamadaActual.linea}
                    </span>
                    <h3 className="text-lg font-bold text-white">
                      {llamadaActual.estado === 'LLAMADA_ENTRANTE' && 'Llamando al 112... Esperando que descuelgue el Operador'}
                      {llamadaActual.estado === 'EN_ATENCION' && `En línea con ${llamadaActual.operadorDemanda}`}
                      {llamadaActual.estado === 'TRASPASADO' && 'Incidente clasificado y traspasado a Coordinación 061'}
                      {llamadaActual.estado === 'ASIGNADO' && '¡Ambulancia movilizada hacia tu ubicación!'}
                      {llamadaActual.estado === 'FINALIZADO' && 'Servicio finalizado'}
                    </h3>
                    <div className="text-xs text-cyan-400 font-mono">
                      AML GPS enviado: {llamadaActual.lat}, {llamadaActual.lng} (±{llamadaActual.precision}m)
                    </div>
                  </div>

                  {llamadaActual.consejoAlertante && (
                    <div className="bg-emerald-950/80 border border-emerald-500 rounded-lg p-3">
                      <div className="text-xs font-bold text-emerald-400 uppercase mb-1">
                        <i className="fa-solid fa-kit-medical mr-1.5"></i>
                        Instrucciones pre-arribo del Operador CECOS:
                      </div>
                      <p className="text-sm text-white font-medium">{llamadaActual.consejoAlertante}</p>
                    </div>
                  )}

                  {llamadaActual.recursosAsignados?.length > 0 && (
                    <div className="bg-blue-950/70 border border-blue-500 rounded-lg p-3 text-center">
                      <span className="text-xs text-blue-300 font-bold uppercase">Unidades en camino: </span>
                      <span className="text-sm font-black text-white">
                        {llamadaActual.recursosAsignados.join(', ')}
                      </span>
                    </div>
                  )}

                  <MapaGIS
                    incidente={llamadaActual}
                    unidades={unidades.filter(u => (llamadaActual.recursosAsignados || []).includes(u.id))}
                    altura="h-52"
                  />

                  <button
                    onClick={() => setLlamadaActivaId(null)}
                    className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-xs font-bold"
                  >
                    Colgar llamada y volver
                  </button>
                </div>

                {/* Canal de Voz Telefónico Bidireccional con el Operador */}
                <div className="lg:col-span-6 flex flex-col justify-center">
                  <LineaTelefonicaVoz
                    incidente={llamadaActual}
                    rolEnLlamada="ALERTANTE"
                    nombreEmisor={`Alertante (${llamadaActual.telefono})`}
                    enviarAudioOTextoLlamada={enviarMensajeEnLlamada}
                  />
                </div>
              </div>
            ) : (
              <form onSubmit={realizarLlamada} className="p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-7 space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Línea de Emergencia</label>
                      <div className="grid grid-cols-2 gap-1.5">
                        <button
                          type="button"
                          onClick={() => setLinea('112')}
                          className={`py-2 rounded font-black text-xs border ${
                            linea === '112' ? 'bg-red-600 border-red-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'
                          }`}
                        >
                          112 CAT
                        </button>
                        <button
                          type="button"
                          onClick={() => setLinea('061')}
                          className={`py-2 rounded font-black text-xs border ${
                            linea === '061' ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'
                          }`}
                        >
                          061 SEM
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Tu Teléfono (CLI)</label>
                      <input
                        type="text"
                        value={telefono}
                        onChange={e => setTelefono(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white font-mono"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Municipio *</label>
                      <input
                        type="text"
                        value={municipio}
                        onChange={e => setMunicipio(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Alertante / Relación</label>
                      <input
                        type="text"
                        placeholder="Ej. Ana López (Hija)"
                        value={alertante}
                        onChange={e => setAlertante(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Dirección Exacta / Punto Km *</label>
                    <input
                      type="text"
                      placeholder="Calle, número, piso, referencias..."
                      value={direccion}
                      onChange={e => setDireccion(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm text-white"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">
                      ¿Qué está ocurriendo? *
                    </label>
                    <textarea
                      rows="3"
                      placeholder="Explica qué ha pasado, consciencia, respiración, síntomas..."
                      value={notas}
                      onChange={e => setNotas(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm text-white"
                      required
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-3 gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Paciente</label>
                      <input
                        type="text"
                        value={nombrePac}
                        onChange={e => setNombrePac(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Edad</label>
                      <input
                        type="text"
                        value={edad}
                        onChange={e => setEdad(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400">Sexo</label>
                      <select
                        value={sexo}
                        onChange={e => setSexo(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white"
                      >
                        <option value="H">H</option>
                        <option value="M">M</option>
                        <option value="D">Desc.</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Columna derecha: Geolocalización AML interactiva */}
                <div className="lg:col-span-5 flex flex-col justify-between bg-slate-900/80 border border-slate-700 rounded-xl p-3 space-y-3">
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-cyan-400 uppercase">
                        <i className="fa-solid fa-location-crosshairs mr-1"></i>
                        Geolocalización AML (GPS)
                      </span>
                      <button
                        type="button"
                        onClick={obtenerGPSReal}
                        className="bg-cyan-700 hover:bg-cyan-600 text-white text-[11px] font-bold px-2.5 py-1 rounded"
                      >
                        Usar mi GPS Real
                      </button>
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Haz clic en cualquier punto del mapa para situar el incidente o usa tu GPS real:
                    </p>

                    <MapaGIS
                      coordenadasSeleccionadas={coords}
                      onSeleccionarPunto={(pt) => {
                        setCoords(pt);
                        setGpsStatus(`Punto fijado en mapa (±${pt.precision}m)`);
                      }}
                      altura="h-52"
                    />

                    <div className="bg-slate-950 border border-slate-800 rounded p-2 font-mono text-[11px] text-emerald-400 flex justify-between">
                      <span>LAT: {coords.lat} | LNG: {coords.lng}</span>
                      <span>±{coords.precision}m</span>
                    </div>
                    <div className="text-[11px] text-slate-400">{gpsStatus}</div>

                  <button
                    type="submit"
                    className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-lg shadow-lg shadow-red-600/30 flex items-center justify-center gap-2 text-sm transition"
                  >
                    <i className="fa-solid fa-phone-volume"></i>
                    LLAMAR AL {linea} Y ENVIAR AML
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. PANTALLA DE LOGIN DE SALA CECOS
    // =========================================================================
    function LoginCECOS({ onLogin }) {
      const [userInput, setUserInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const encontrado = USUARIOS_AULA.find(
          u => u.user.toLowerCase() === userInput.trim().toLowerCase() && u.pass === passInput.trim()
        );
        if (!encontrado) {
          setError('Usuario o contraseña incorrectos.');
          return;
        }
        onLogin(encontrado);
      };

      const autocompletar = (u, p) => {
        setUserInput(u);
        setPassInput(p);
        setError('');
      };

      return (
        <div className="flex-1 flex items-center justify-center p-4">
          <div className="max-w-3xl w-full grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
            <div className="flex flex-col justify-between">
              <div>
                <div className="inline-block bg-blue-600/20 text-blue-400 border border-blue-500/40 text-xs font-bold px-2.5 py-1 rounded mb-3">
                  ACCESO RESTRINGIDO · OPERADORES CECOS
                </div>
                <h2 className="text-2xl font-bold text-white mb-2">Identificación de Puesto</h2>
                <p className="text-sm text-slate-400 mb-5">
                  Introduce las credenciales asignadas para entrar en tu consola de Teleemergencias.
                </p>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Usuario</label>
                    <input
                      type="text"
                      value={userInput}
                      onChange={e => { setUserInput(e.target.value); setError(''); }}
                      placeholder="Ej. demanda1, respuesta1, unidad1..."
                      className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Contraseña</label>
                    <input
                      type="password"
                      value={passInput}
                      onChange={e => { setPassInput(e.target.value); setError(''); }}
                      placeholder="••••"
                      className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white"
                      required
                    />
                  </div>
                  {error && <p className="text-xs text-red-400 font-semibold">{error}</p>}
                  <button

                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition"
                  >
                    Iniciar Turno en Sala
                  </button>
                </form>
              </div>
            </div>

            <div className="bg-slate-900/90 border border-slate-700 rounded-lg p-4 text-xs space-y-2.5">
              <h3 className="font-bold text-slate-200 uppercase tracking-wider border-b border-slate-800 pb-1.5">
                Credenciales de Puestos (Clic para rellenar)
              </h3>
              <div className="space-y-1.5 text-slate-300">
                <div onClick={() => autocompletar('demanda1', '112')} className="cursor-pointer hover:bg-slate-700 p-2 rounded bg-slate-800/80 flex justify-between items-center">
                  <span><strong className="text-amber-400">Gestor Demanda:</strong> demanda1 / demanda2 / demanda3</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">112</span>
                </div>
                <div onClick={() => autocompletar('respuesta1', '061')} className="cursor-pointer hover:bg-slate-700 p-2 rounded bg-slate-800/80 flex justify-between items-center">
                  <span><strong className="text-emerald-400">Gestor Respuesta:</strong> respuesta1 / respuesta2</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">061</span>
                </div>
                <div onClick={() => autocompletar('unidad1', 'sem')} className="cursor-pointer hover:bg-slate-700 p-2 rounded bg-slate-800/80 flex justify-between items-center">
                  <span><strong className="text-cyan-400">Unidades (Walkie):</strong> unidad1 ... unidad5</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">sem</span>
                </div>
                <div onClick={() => autocompletar('profe', '112')} className="cursor-pointer hover:bg-slate-700 p-2 rounded bg-slate-800/80 flex justify-between items-center">
                  <span><strong className="text-purple-400">Profesor / Evaluación:</strong> profe</span>
                  <span className="font-mono bg-slate-950 px-1.5 py-0.5 rounded">112</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3A. CONSOLA GESTOR DE DEMANDA (CON MAPA GIS AML Y LÍNEA VOZ ALERTANTE)
    // =========================================================================
    function ConsolaGestorDemanda({ usuario, incidentes, unidades, actualizarIncidente }) {
      const [selectedId, setSelectedId] = useState(null);
      const [subVista, setSubVista] = useState('FICHA'); // 'FICHA' | 'GIS_VOZ'
      const [form, setForm] = useState({
        telefono: '',
        alertante: '',
        poblacion: '',
        municipio: '',
        direccion: '',
        notas: '',
        nombrePac: '',
        edad: '',
        sexo: 'H',
        nss: '',
        tipoDemanda: TIPOS_DEMANDA[0],
        interrogatorio: '',
        clasificacion: CLASIFICACIONES[1].code,
        consejoAlertante: CONSEJOS_PREARRIVO[0]
      });

      const dirInputRef = useRef(null);
      const clasifSelectRef = useRef(null);

      const entrantes = incidentes.filter(i => i.estado === 'LLAMADA_ENTRANTE');
      const enCurso = incidentes.filter(i => i.estado === 'EN_ATENCION');
      const incidenteActivo = incidentes.find(i => i.id === selectedId);

      useEffect(() => {
        if (incidenteActivo) {
          setForm({
            telefono: incidenteActivo.telefono || '',
            alertante: incidenteActivo.alertante || '',
            poblacion: incidenteActivo.poblacion || '',
            municipio: incidenteActivo.municipio || '',
            direccion: incidenteActivo.direccion || '',
            notas: incidenteActivo.notas || '',
            nombrePac: incidenteActivo.nombrePac || '',
            edad: incidenteActivo.edad || '',
            sexo: incidenteActivo.sexo || 'H',
            nss: incidenteActivo.nss || '',
            tipoDemanda: incidenteActivo.tipoDemanda || TIPOS_DEMANDA[0],
            interrogatorio: incidenteActivo.interrogatorio || '',
            clasificacion: incidenteActivo.clasificacion || CLASIFICACIONES[1].code,
            consejoAlertante: incidenteActivo.consejoAlertante || CONSEJOS_PREARRIVO[0]
          });
        }
      }, [selectedId]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.altKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            setSubVista('FICHA');
            setTimeout(() => dirInputRef.current?.focus(), 50);
          } else if (e.altKey && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            setSubVista('FICHA');
            setTimeout(() => clasifSelectRef.current?.focus(), 50);
          } else if (e.altKey && e.key.toLowerCase() === 't') {
            e.preventDefault();
            if (incidenteActivo) traspasarARespuesta();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      });

      const atenderSiguienteLlamada = async () => {
        const sig = entrantes[0] || enCurso[0];
        if (!sig) {
          alert('No hay llamadas entrantes en cola.');
          return;
        }
        setSelectedId(sig.id);
        if (sig.estado === 'LLAMADA_ENTRANTE') {
          const hora = new Date().toLocaleTimeString('es-ES');
          await actualizarIncidente(sig.id, {
            estado: 'EN_ATENCION',
            operadorDemanda: usuario.nombre,
            cronologia: [...(sig.cronologia || []), { hora, texto: `Llamada atendida por ${usuario.nombre}` }]
          });
        }
      };

      const guardarCambiosFicha = async () => {
        if (!incidenteActivo) return;
        await actualizarIncidente(incidenteActivo.id, { ...form });
        alert('Datos guardados en ficha ' + incidenteActivo.numFicha);
      };

      const traspasarARespuesta = async () => {
        if (!incidenteActivo) return;
        if (!form.direccion.trim() || !form.clasificacion) {
          alert('Debes completar la Dirección y la Clasificación antes de traspasar.');
          return;
        }
        const hora = new Date().toLocaleTimeString('es-ES');
        await actualizarIncidente(incidenteActivo.id, {
          ...form,
          estado: 'TRASPASADO',
          horaTraspaso: hora,
          operadorDemanda: usuario.nombre,
          cronologia: [
            ...(incidenteActivo.cronologia || []),
            { hora, texto: `Ficha clasificada (${form.clasificacion}) y traspasada a Gestor de Respuesta por ${usuario.nombre}` }
          ]
        });
        alert(`Ficha ${incidenteActivo.numFicha} traspasada a Coordinación 061.`);
        setSelectedId(null);
      };

      const enviarMensajeEnLlamada = async (nuevoMsg) => {
        if (!incidenteActivo) return;
        await actualizarIncidente(incidenteActivo.id, {
          mensajesLlamada: [...(incidenteActivo.mensajesLlamada || []), nuevoMsg]
        });
      };

      return (
        <div className="win-panel text-black rounded overflow-hidden flex flex-col flex-1 font-sans text-xs">
          <div className="win-titlebar px-2.5 py-1 flex items-center justify-between text-white font-bold">
            <div className="flex items-center gap-2">
              <i className="fa-solid fa-phone-volume text-yellow-300"></i>
              <span>Recepción de llamadas telefónicas - extensión [{usuario.user.toUpperCase()}]</span>
            </div>
            {entrantes.length > 0 && (
              <span className="bg-red-600 text-white px-2 py-0.5 rounded animate-pulse font-black">
                ¡{entrantes.length} LLAMADA(S) ENTRANDO!
              </span>
            )}
          </div>

          {/* Barra superior */}
          <div className="p-2 border-b border-gray-400 flex flex-wrap items-center justify-between gap-2 bg-[#d4d0c8]">
            <div className="flex flex-wrap items-center gap-1.5">
              <button
                onClick={atenderSiguienteLlamada}
                className={`win-btn px-3 py-1.5 font-bold flex items-center gap-1.5 ${
                  entrantes.length > 0 ? 'bg-yellow-200 ring-2 ring-red-600' : ''
                }`}
              >
                <i className="fa-solid fa-phone text-green-700"></i>
                Atender llamada ({entrantes.length})
              </button>

              <button
                onClick={() => setSubVista('FICHA')}
                className={`win-btn px-2.5 py-1.5 font-bold ${subVista === 'FICHA' ? 'bg-blue-200' : ''}`}
              >
                <i className="fa-solid fa-file-lines mr-1 text-blue-800"></i>
                Ficha Despacho
              </button>

              <button
                onClick={() => setSubVista('GIS_VOZ')}
                className={`win-btn px-2.5 py-1.5 font-bold ${subVista === 'GIS_VOZ' ? 'bg-emerald-200' : ''}`}
              >
                <i className="fa-solid fa-map-location-dot mr-1 text-red-700"></i>
                Mapa AML + Voz Alertante
              </button>
            </div>

            <div className="flex items-center gap-1.5">
              <span className="font-bold">Fichas:</span>
              <select
                value={selectedId || ''}
                onChange={e => setSelectedId(e.target.value || null)}
                className="win-inset px-2 py-1 text-xs font-bold min-w-[190px]"
              >
                <option value="">-- Seleccionar ficha --</option>
                {incidentes.map(inc => (
                  <option key={inc.id} value={inc.id}>
                    {inc.numFicha} | {inc.estado} | {inc.municipio}
                  </option>
                ))}
              </select>
            </div>
          </div>

          {/* Tira compacta siempre visible de voz con alertante cuando hay ficha activa */}
          {incidenteActivo && subVista === 'FICHA' && (
            <div className="bg-slate-900 text-white px-3 py-2 border-b border-gray-500 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-green-400 animate-ping"></span>
                <span className="font-bold text-blue-300">Línea Voz con {incidenteActivo.telefono}:</span>
                <span className="text-slate-300 font-mono text-[11px]">
                  AML: {incidenteActivo.lat}, {incidenteActivo.lng} (±{incidenteActivo.precision}m)
                </span>
              </div>
              <button
                type="button"
                onClick={() => setSubVista('GIS_VOZ')}
                className="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-[11px] font-bold"
              >
                <i className="fa-solid fa-microphone mr-1"></i>
                Abrir Voz y Mapa AML
              </button>
            </div>
          )}

          {subVista === 'GIS_VOZ' ? (
            <div className="p-3 bg-slate-800 text-white flex-1 grid grid-cols-1 md:grid-cols-12 gap-3">
              {incidenteActivo ? (
                <>
                  <div className="md:col-span-6 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-xs text-cyan-400 uppercase">
                        Localización AML Recibida ({incidenteActivo.numFicha})
                      </span>
                      <span className="font-mono text-[11px] text-amber-300">
                        {incidenteActivo.lat}, {incidenteActivo.lng} (±{incidenteActivo.precision}m)
                      </span>
                    </div>
                    <MapaGIS
                      incidente={incidenteActivo}
                      unidades={unidades}
                      altura="h-72"
                    />
                    <div className="bg-slate-900 p-2 rounded text-xs">
                      <strong>Dirección declarada:</strong> {incidenteActivo.direccion} ({incidenteActivo.municipio})
                    </div>
                  </div>
                  <div className="md:col-span-6 flex flex-col justify-center">
                    <LineaTelefonicaVoz
                      incidente={incidenteActivo}
                      rolEnLlamada="OPERADOR"
                      nombreEmisor={`Operador 112 (${usuario.user.toUpperCase()})`}
                      enviarAudioOTextoLlamada={enviarMensajeEnLlamada}
                    />
                  </div>
                </>
              ) : (
                <div className="col-span-12 flex items-center justify-center text-slate-400 py-12">
                  Selecciona o atiende una llamada primero para ver su geolocalización AML y hablar con el alertante.
                </div>
              )}
            </div>
          ) : (
            <div className="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 p-3">
              <div className="md:col-span-7 space-y-2.5">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="font-bold block mb-0.5">Teléfono Alertante:</label>
                    <input
                      type="text"
                      value={form.telefono}
                      onChange={e => setForm({ ...form, telefono: e.target.value })}
                      className="win-inset w-full px-2 py-1 font-mono font-bold text-blue-900"
                    />
                  </div>
                  <div>
                    <label className="font-bold block mb-0.5">Alertante / Relación:</label>
                    <input
                      type="text"
                      value={form.alertante}
                      onChange={e => setForm({ ...form, alertante: e.target.value })}
                      className="win-inset w-full px-2 py-1"
                    />
                  </div>
                </div>

                <div className="border border-gray-500 p-2 space-y-2 bg-[#dcd8d0]">
                  <div className="font-bold text-blue-900 border-b border-gray-400 pb-0.5 flex justify-between">
                    <span>LOCALIZACIÓN DEL INCIDENTE</span>
                    {incidenteActivo?.lat && (
                      <span className="font-mono text-[10px] text-red-700">
                        GPS AML: {incidenteActivo.lat}, {incidenteActivo.lng}
                      </span>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-0.5">Municipio:</label>
                      <input
                        type="text"
                        value={form.municipio}
                        onChange={e => setForm({ ...form, municipio: e.target.value })}
                        className="win-inset w-full px-2 py-1"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-0.5">Población / Barrio:</label>
                      <input
                        type="text"
                        value={form.poblacion}
                        onChange={e => setForm({ ...form, poblacion: e.target.value })}
                        className="win-inset w-full px-2 py-1"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-0.5">Dirección exacta y referencias:</label>
                    <input
                      ref={dirInputRef}
                      type="text"
                      value={form.direccion}
                      onChange={e => setForm({ ...form, direccion: e.target.value })}
                      className="win-inset w-full px-2 py-1 font-semibold"
                    />
                  </div>
                </div>

                <div>
                  <label className="font-bold block mb-0.5">Notas iniciales de la llamada:</label>
                  <textarea
                    rows="3"
                    value={form.notas}
                    onChange={e => setForm({ ...form, notas: e.target.value })}
                    className="win-inset w-full px-2 py-1"
                  ></textarea>
                </div>

                <div className="border border-gray-500 p-2 space-y-2 bg-[#dcd8d0]">
                  <div className="font-bold text-blue-900 border-b border-gray-400 pb-0.5">
                    FILIACIÓN DEL PACIENTE
                  </div>

    // =========================================================================
    // 3B. CONSOLA GESTOR DE RESPUESTA (CON MAPA GIS DE FLOTA EN TIEMPO REAL)
    // =========================================================================
    function ConsolaGestorRespuesta({
      usuario, incidentes, unidades, actualizarIncidente, actualizarUnidad, enviarMensajeRadio
    }) {
      const [selectedId, setSelectedId] = useState(null);
      const pendientes = incidentes.filter(i => i.estado === 'TRASPASADO' || i.estado === 'ASIGNADO');
      const incActivo = incidentes.find(i => i.id === selectedId) || pendientes[0] || null;

      useEffect(() => {
        if (!selectedId && pendientes.length > 0) {
          setSelectedId(pendientes[0].id);
        }
      }, [pendientes.length]);

      const asignarUnidad = async (unidad) => {
        if (!incActivo) return;
        if (unidad.estado !== 'DISPONIBLE') {
          alert(`La unidad ${unidad.id} no está disponible (${unidad.estado}).`);
          return;
        }
        const hora = new Date().toLocaleTimeString('es-ES');
        const nuevosRecursos = [...(incActivo.recursosAsignados || []), unidad.id];

        await actualizarUnidad(unidad.id, {
          estado: 'ACTIVADA',
          incidenteId: incActivo.id
        });

        await actualizarIncidente(incActivo.id, {
          estado: 'ASIGNADO',
          gestorRespuesta: usuario.nombre,
          recursosAsignados: nuevosRecursos,
          cronologia: [
            ...(incActivo.cronologia || []),
            { hora, texto: `Unidad ${unidad.id} (${unidad.tipo}) movilizada por ${usuario.nombre}` }
          ]
        });

        await enviarMensajeRadio({
          emisor: `CENTRAL 061 (${usuario.user.toUpperCase()})`,
          canal: 'CANAL 1 - EMERGENCIAS',
          texto: `Atención ${unidad.id}, servicio ${incActivo.numFicha}: ${incActivo.clasificacion}. Dirección: ${incActivo.direccion} (${incActivo.municipio}). Coordenadas GPS: ${incActivo.lat}, ${incActivo.lng}.`
        });
      };

      const finalizarServicio = async (inc) => {
        const hora = new Date().toLocaleTimeString('es-ES');
        for (const uId of (inc.recursosAsignados || [])) {
          const baseOrig = UNIDADES_INICIALES.find(u => u.id === uId);
          await actualizarUnidad(uId, {
            estado: 'DISPONIBLE',
            incidenteId: null,
            lat: baseOrig?.lat || 41.3888,
            lng: baseOrig?.lng || 2.1619
          });
        }
        await actualizarIncidente(inc.id, {
          estado: 'FINALIZADO',
          cronologia: [...(inc.cronologia || []), { hora, texto: `Servicio cerrado y unidades liberadas por ${usuario.nombre}` }]
        });
      };

      return (
        <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 flex-1 flex flex-col gap-3">
          <div className="flex items-center justify-between border-b border-slate-700 pb-2">
            <div>
              <h2 className="font-bold text-base text-emerald-400">
                <i className="fa-solid fa-truck-medical mr-2"></i>
                Mesa de Coordinación GIS y Despacho de Flota (061 SEM)
              </h2>
              <p className="text-xs text-slate-400">Visualiza el punto AML del incidente y la posición GPS de las ambulancias</p>
            </div>
            <span className="bg-emerald-950 border border-emerald-600 text-emerald-300 text-xs font-bold px-2.5 py-1 rounded">
              {pendientes.length} Servicios Activos
            </span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-12 gap-4 flex-1">
            <div className="md:col-span-4 space-y-2 overflow-y-auto max-h-[500px]">
              <h3 className="text-xs font-bold uppercase text-slate-400">Bandeja de Servicios</h3>
              {pendientes.length === 0 ? (
                <div className="bg-slate-900/60 border border-slate-700 rounded-lg p-4 text-xs text-slate-400 text-center">
                  No hay fichas traspasadas pendientes.
                </div>
              ) : (
                pendientes.map(inc => (
                  <div
                    key={inc.id}
                    onClick={() => setSelectedId(inc.id)}
                    className={`p-3 rounded-lg border cursor-pointer transition ${
                      incActivo?.id === inc.id
                        ? 'bg-slate-700 border-emerald-400 shadow-lg'
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500'
                    }`}
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-mono font-bold text-xs text-amber-300">{inc.numFicha}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        inc.estado === 'TRASPASADO' ? 'bg-red-600 text-white animate-pulse' : 'bg-blue-600 text-white'
                      }`}>
                        {inc.estado}
                      </span>
                    </div>
                    <div className="text-xs font-bold text-white">{inc.clasificacion}</div>
                    <div className="text-xs text-slate-300 mt-0.5">
                      <i className="fa-solid fa-location-dot text-red-400 mr-1"></i>
                      {inc.direccion} ({inc.municipio})
                    </div>
                    {inc.recursosAsignados?.length > 0 && (
                      <div className="mt-1.5 flex flex-wrap gap-1">
                        {inc.recursosAsignados.map(r => (
                          <span key={r} className="bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">
                            {r}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>

            <div className="md:col-span-8 flex flex-col justify-between bg-slate-900/80 border border-slate-700 rounded-lg p-3 space-y-3">
              {incActivo ? (
                <>
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between items-start border-b border-slate-700 pb-1.5">
                      <div>
                        <span className="text-amber-400 font-mono font-bold">{incActivo.numFicha}</span>
                        <h4 className="font-bold text-sm text-white">{incActivo.tipoDemanda}</h4>
                      </div>
                      <button
                        onClick={() => finalizarServicio(incActivo)}
                        className="bg-slate-700 hover:bg-slate-600 text-white px-2.5 py-1 rounded text-xs font-bold"
                      >
                        Cerrar Servicio
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-slate-800 p-2 rounded">
                      <div><strong>Dirección:</strong> {incActivo.direccion}, {incActivo.municipio}</div>
                      <div><strong>GPS AML:</strong> <span className="font-mono text-cyan-400">{incActivo.lat}, {incActivo.lng}</span></div>
                      <div><strong>Paciente:</strong> {incActivo.nombrePac || 'No filiado'} ({incActivo.edad || '?'}a, {incActivo.sexo})</div>
                      <div><strong>Prioridad:</strong> <span className="text-red-400 font-bold">{incActivo.clasificacion}</span></div>
                    </div>

                    {/* Mapa GIS Táctico con Incidente y Unidades */}
                    <MapaGIS
                      incidente={incActivo}
                      unidades={unidades}
                      altura="h-44"
                    />
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-1.5">
                      Flota SEM Disponible (Clic para movilizar):
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {unidades.map(u => (
                        <div
                          key={u.id}
                          className="bg-slate-800 border border-slate-700 rounded p-2 flex items-center justify-between"
                        >
                          <div>
                            <div className="font-bold text-xs text-white">
                              {u.id} <span className="text-cyan-400">({u.tipo})</span>
                            </div>
                            <div className="text-[11px] text-slate-400">{u.base}</div>
                          </div>

                          {u.estado === 'DISPONIBLE' ? (
                            <button
                              onClick={() => asignarUnidad(u)}
                              className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded"
                            >
                              Movilizar
                            </button>
                          ) : (
                            <span className="text-[10px] font-bold px-2 py-1 rounded bg-amber-900/70 text-amber-300 border border-amber-700">
                              {u.estado}
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              ) : (
                <div className="flex-1 flex items-center justify-center text-xs text-slate-500">
                  Selecciona un servicio de la izquierda para ver su mapa GIS y despachar unidades.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3C. CONSOLA DE UNIDAD MÓVIL (NAVEGADOR GPS + ESTATUS OPERATIVOS)
    // =========================================================================
    function ConsolaUnidadMovil({
      usuario, incidentes, unidades, actualizarIncidente, actualizarUnidad, enviarMensajeRadio
    }) {
      const miUnidad = unidades.find(u => u.id === usuario.indicativo) || unidades[0];
      const miServicio = incidentes.find(i => i.id === miUnidad?.incidenteId);

      const cambiarEstatus = async (nuevoEstado, codigoTetra) => {
        const hora = new Date().toLocaleTimeString('es-ES');
        let nuevasCoords = { lat: miUnidad.lat, lng: miUnidad.lng };

        // Simular desplazamiento GPS hacia el punto del incidente
        if (nuevoEstado === 'EN_CAMINO' && miServicio?.lat) {
          nuevasCoords = {
            lat: Number(((miUnidad.lat + miServicio.lat) / 2).toFixed(6)),
            lng: Number(((miUnidad.lng + miServicio.lng) / 2).toFixed(6))
          };
        } else if (nuevoEstado === 'EN_LUGAR' && miServicio?.lat) {
          nuevasCoords = {
            lat: Number((miServicio.lat + 0.00015).toFixed(6)),
            lng: Number((miServicio.lng + 0.00015).toFixed(6))
          };
        }

        await actualizarUnidad(miUnidad.id, {
          estado: nuevoEstado,
          incidenteId: nuevoEstado === 'DISPONIBLE' ? null : miUnidad.incidenteId,
          ...nuevasCoords
        });

        if (miServicio) {
          await actualizarIncidente(miServicio.id, {
            cronologia: [
              ...(miServicio.cronologia || []),
              { hora, texto: `[${miUnidad.id}] Estatus cambiado a ${nuevoEstado} (${codigoTetra})` }
            ]
          });
        }

        await enviarMensajeRadio({
          emisor: `UNIDAD ${miUnidad.id}`,
          canal: 'CANAL 1 - EMERGENCIAS',
          texto: `${miUnidad.id} informa estatus: ${nuevoEstado} (${codigoTetra}).`
        });
      };

      return (
        <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 flex-1 flex flex-col justify-between gap-3">
          <div className="flex items-center justify-between border-b border-slate-700 pb-2">
            <div>
              <span className="text-xs font-bold text-cyan-400 uppercase">Terminal Embarcado GPS / TETRA</span>
              <h2 className="text-lg font-black text-white">
                Indicativo {miUnidad?.id} — {miUnidad?.tipo}
              </h2>
            </div>
            <span className="px-3 py-1 rounded-full text-xs font-black bg-cyan-950 border border-cyan-500 text-cyan-300">
              ESTATUS: {miUnidad?.estado}
            </span>
          </div>

          {miServicio ? (
            <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
              <div className="md:col-span-6 bg-slate-900 border-2 border-amber-500/70 rounded-xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <span className="bg-red-600 text-white text-xs font-black px-2 py-0.5 rounded">
                    SERVICIO: {miServicio.numFicha}
                  </span>
                  <span className="text-xs font-bold text-amber-300">{miServicio.clasificacion}</span>
                </div>
                <div className="text-sm font-bold text-white">
                  <i className="fa-solid fa-location-dot text-red-500 mr-1.5"></i>
                  {miServicio.direccion} ({miServicio.municipio})
                </div>
                <p className="text-xs text-slate-300 bg-slate-800 p-2 rounded">
                  {miServicio.notas}
                </p>
                <div className="text-[11px] text-slate-400">
                  <strong>Paciente:</strong> {miServicio.nombrePac || 'Sin filiar'} · <strong>Alertante:</strong> {miServicio.telefono}
                </div>
              </div>

              <div className="md:col-span-6">
                <MapaGIS
                  incidente={miServicio}
                  unidades={[miUnidad]}
                  altura="h-48"
                />
              </div>
            </div>
          ) : (
            <div className="bg-slate-900/60 border border-slate-700 rounded-xl p-6 text-center text-slate-400">
              <i className="fa-solid fa-truck-medical text-3xl mb-2 text-slate-600"></i>
              <p className="text-xs font-semibold">Unidad operativa en {miUnidad?.base}. A la espera de activación por Central 061.</p>
            </div>
          )}

          <div>
            <h3 className="text-xs font-bold uppercase text-slate-400 mb-2">Pulsadores de Estatus Operativo (Actualizan posición GPS):</h3>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
              <button
                onClick={() => cambiarEstatus('EN_CAMINO', 'En ruta al lugar')}
                className="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-2 rounded text-xs"
              >
                1. En Camino
              </button>
              <button
                onClick={() => cambiarEstatus('EN_LUGAR', 'En el punto / Asistiendo')}
                className="bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 px-2 rounded text-xs"
              >
                2. En el Lugar
              </button>
              <button
                onClick={() => cambiarEstatus('TRASLADANDO', 'Traslado a Hospital')}
                className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 px-2 rounded text-xs"
              >
                3. Trasladando
              </button>
              <button
                onClick={() => cambiarEstatus('EN_HOSPITAL', 'Transferencia Urgencias')}
                className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-2 rounded text-xs"
              >
                4. En Hospital
              </button>
              <button
                onClick={() => cambiarEstatus('DISPONIBLE', 'QAP / Operativo Libre')}

              >
                5. Disponible
              </button>
            </div>
          </div>
        </div>
      );
    }
